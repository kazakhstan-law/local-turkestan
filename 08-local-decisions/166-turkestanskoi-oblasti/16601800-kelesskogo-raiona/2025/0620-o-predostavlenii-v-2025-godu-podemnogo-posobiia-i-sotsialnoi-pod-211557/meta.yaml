act_code: '211557'
requisite: Решение Келесского районного маслихата Туркестанской области от 20 июня 2025 года № 26-194-VIII
title:
  rus: О предоставлении в 2025 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов и поселков, прибывшим для работы и проживания в сельские населенные пункты Келесского района
  kaz: 2025 жылы Келес ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер мен кенттер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
