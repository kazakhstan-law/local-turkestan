act_code: '133406'
requisite: Решение Келесского районного маслихата Туркестанской области от 25 июня 2019 года № 15-109-VI. Зарегистрировано Департаментом юстиции Туркестанской области 16 июля 2019 года № 5139. Утратило силу решением Келесского районного маслихата Туркестанской области от 29 сентября 2020 года № 31-225-VI (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Келесского района
  kaz: Келес ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға әлеуметтік көмек беру туралы
