act_code: '133409'
requisite: Решение Келесского районного маслихата Туркестанской области от 25 июня 2019 года № 15-111-VI. Зарегистрировано Департаментом юстиции Туркестанской области 16 июля 2019 года № 5140. Утратило силу решением Келесского районного маслихата Туркестанской области от 31 января 2020 года № 22-165-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Келесскому району
  kaz: Келес ауданы бойынша коммуналдық қалдықтардың түзілумен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
