act_code: '139682'
requisite: Решение Келесского районного маслихата Туркестанской области от 31 января 2020 года № 22-162-VI. Зарегистрировано Департаментом юстиции Туркестанской области 18 февраля 2020 года № 5430
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акима села, сельских округов Келесского района, прибывшим для работы и проживания в сельские населенные пункты Келесского района
  kaz: Келес ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
