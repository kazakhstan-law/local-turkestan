  title:
    rus: О внесении изменений в решение Келесского районного маслихата от 31 января 2020 года № 22/162-VI «О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Келесского района»
    kaz: Келес аудандық мәслихатының 2020 жылғы 31 қаңтардағы № 22-162-VI «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгерістер енгізу туралы
