act_code: '52371'
requisite: Оңтүстік Қазақстан облысы Түлкібас ауданы әкімдігі Келтемашат ауылдық округі әкімінің 2010 жылғы 23 сәуірдегі N 22 шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2010 жылғы 12 мамырда N 14-14-108 тіркелді
