requisite: Решение акима сельского округа Жана ауыл Жетысайского района Туркестанской области от 20 января 2020 года № 11. Зарегистрировано Департаментом юстиции Туркестанской области 20 января 2020 года № 5379. Утратило силу решением сельского округа Жана ауыл Жетысайского района Туркестанской области от 27 марта 2020 года № 34 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории от улице Мамыт ата до улицы Байконура, Достара и Улы Жибек жолы населенного пункта Жана ауыл, сельского округа Жана ауыл Жетысайского района
  kaz: Жетісай ауданының Жаңа ауыл ауылдық округі, Жаңа ауыл елді мекені Мамыт ата көшесінен Байқоңыр, Достар, Ұлы Жібек жолы көшелеріне дейінгі аумағына шектеу іс-шараларын белгілеу туралы
