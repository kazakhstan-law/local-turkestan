requisite: Решение Жетысайского районного маслихата Туркестанской области от 9 января 2020 года № 26-148-VI. Зарегистрировано Департаментом юстиции Туркестанской области 10 января 2020 года № 5364. Утратило силу решением Жетысайского районного маслихата Туркестанской области от 25 ноября 2020 года № 38-199-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жетысайского района
  kaz: Жетісай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
