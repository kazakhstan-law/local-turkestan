requisite: Решение акима сельского округа Казыбек би Жетысайского района Туркестанской области от 3 февраля 2020 года № 14. Зарегистрировано Департаментом юстиции Туркестанской области 4 февраля 2020 года № 5392. Утратило силу решением акима сельского округа Казыбек би Жетысайского района Туркестанской области от 6 апреля 2020 года № 40 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на улицы М.Жасузакова улицам Т.Алекенова и Кокбулак населенного пункта Таубай ата, сельского округа Казыбек би Жетысайского района
  kaz: Жетісай ауданының Қазыбек би ауылдық округі, Таубай ата елді мекені М.Жасұзақов көшесінен Т.Алекенов және Көкбұлақ көшелеріне шектеу іс-шараларын белгілеу туралы
