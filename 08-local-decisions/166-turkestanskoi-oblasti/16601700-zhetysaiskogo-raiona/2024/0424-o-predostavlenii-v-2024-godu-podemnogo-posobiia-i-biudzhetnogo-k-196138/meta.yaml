  title:
    rus: О внесении изменения в решение Жетысайского районного маслихата от 24 апреля 2024 года № 15-95-VIII «О предоставлении в 2024 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жетысайского района»
    kaz: Жетісай аудандық мәслихатының 2024 жылғы 24 сәуірдегі № 15-95-VІІІ «Жетісай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округ әкімдері апппараттарының мемлекеттік қызметшілеріне 2024 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгеріс енгізу туралы
