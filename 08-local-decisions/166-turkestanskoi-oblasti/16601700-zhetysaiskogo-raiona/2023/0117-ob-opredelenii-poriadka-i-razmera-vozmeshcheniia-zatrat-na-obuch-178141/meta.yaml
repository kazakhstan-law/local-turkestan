requisite: Решение Жетысайского районного маслихата Туркестанской области от 17 января 2023 года № 30-198-VII. Зарегистрировано Департаментом юстиции Туркестанской области 19 января 2023 года № 6233. Утратило силу решением Жетысайского районного маслихата Туркестанской области от 27 декабря 2023 года № 11-72-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
