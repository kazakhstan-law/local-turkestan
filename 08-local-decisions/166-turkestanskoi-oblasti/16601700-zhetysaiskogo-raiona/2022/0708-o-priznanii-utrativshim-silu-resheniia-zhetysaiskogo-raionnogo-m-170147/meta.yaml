act_code: '170147'
requisite: Решение Жетысайского районного маслихата Туркестанской области от 8 июля 2022 года № 23-148-VII
title:
  rus: О признании утратившим силу решения Жетысайского районного маслихата от 15 марта 2022 года № 18-106-VIІ «Об установлении повышенные на двадцать пять процентов должностные оклады и тарифные ставки специалистам в области социального обеспечения, культуры, спорта, являющимся гражданскими служащими и работающим в сельской местности»
  kaz: Жетісай аудандық мәслихатының 2022 жылғы 15 наурыздағы № 18-106-VII «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгiлеу туралы» шешімінің күшін жою туралы
