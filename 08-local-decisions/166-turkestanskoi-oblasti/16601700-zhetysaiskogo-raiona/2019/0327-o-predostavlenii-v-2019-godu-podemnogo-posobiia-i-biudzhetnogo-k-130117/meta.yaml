requisite: Решение Жетысайского районного маслихата Туркестанской области от 27 марта 2019 года № 12-77-VI. Зарегистрировано Департаментом юстиции Туркестанской области 3 апреля 2019 года № 4956
title:
  rus: О предоставлении в 2019 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жетысайского района
  kaz: Жетісай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
