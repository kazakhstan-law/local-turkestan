act_code: '208996'
requisite: Решение Жетысайского районного маслихата Туркестанской области от 7 апреля 2025 года № 27-170-VIII
title:
  rus: О предоставлении на 2025 год подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жетысайского района
  kaz: Жетісай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері апппаратының мемлекеттік қызметшілеріне 2025 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
