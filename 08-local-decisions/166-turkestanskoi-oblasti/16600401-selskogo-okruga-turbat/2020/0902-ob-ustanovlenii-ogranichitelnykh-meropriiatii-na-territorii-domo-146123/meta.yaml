requisite: Решение акима сельского округа Шанак Казыгуртского района Туркестанской области от 2 сентября 2020 года № 20. Зарегистрировано Департаментом юстиции Туркестанской области 2 сентября 2020 года № 5770. Утратило силу решением акима сельского округа Шанак Казыгуртского района Туркестанской области от 20 ноября 2020 года № 35 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
