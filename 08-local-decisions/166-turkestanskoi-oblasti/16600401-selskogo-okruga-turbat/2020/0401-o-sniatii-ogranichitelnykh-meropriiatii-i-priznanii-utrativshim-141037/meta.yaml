act_code: '141037'
requisite: Решение акима сельского округа Шанак Казыгуртского района Туркестанской области от 1 апреля 2020 года № 10. Зарегистрировано Департаментом юстиции Туркестанской области 1 апреля 2020 года № 5535
title:
  rus: О снятии ограничительных мероприятий и признании утратившим силу решение акима сельского округа Шанак от 21 января 2020 года № 2 «Об установлении ограничительных мер на территории животноводческой фермы «Аралбай» населенного пункта Акжар сельского округа Шанак Казыгуртского района»
  kaz: Шектеу іс-шараларын алып тастау және Шанақ ауылы округі әкімінің 2020 жылғы 21 қаңтардағы № 2 «Қазығұрт ауданының Шанақ ауылы округі, Ақжар елді мекені «Аралбай» мал шаруашылығы фермасының аумағында шектеу іс-шарасын белгілеу туралы» шешімінің күшін жою туралы
