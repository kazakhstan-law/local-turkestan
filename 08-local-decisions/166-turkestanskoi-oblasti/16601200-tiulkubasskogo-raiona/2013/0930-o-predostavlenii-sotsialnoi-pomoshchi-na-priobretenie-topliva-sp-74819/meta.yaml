act_code: '74819'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 30 сентября 2013 года № 19/4-05. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 октября 2013 года № 2381. Утратило силу решением Тюлькубасского районного маслихата Туркестанской области от 18 марта 2019 года № 37/9-06
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
