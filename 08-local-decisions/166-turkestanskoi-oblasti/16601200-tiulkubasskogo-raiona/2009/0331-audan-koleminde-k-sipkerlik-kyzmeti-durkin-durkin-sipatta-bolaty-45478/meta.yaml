  title:
    rus: О внесении изменений в решение Тюлькубасского районного маслихата от 31 марта 2009 года № 17/8-04 "О стоимости разовых талонов для физических лиц, предпринимательская деятельность которых носит эпизодический характер на территории района"
    kaz: '"Аудан көлемінде кәсіпкерлік кызметі дүркін-дүркін сипатта болатын жеке тұлғалар үшін бір жолғы талондардың құны туралы" Түлкібас аудандық мәслихатының 2009 жылғы 31 наурыздағы 17/8-04 шешіміне өзгерістер енгізу туралы'
