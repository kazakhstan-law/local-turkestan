act_code: '44240'
requisite: Оңтүстік Қазақстан облысы Түлкібас аудандық маслихатының 2009 жылғы 29 қаңтардағы N 15/3-04 шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2009 жылғы 13 ақпанда N 14-14-66 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2009 жылғы 13 шілдедегі N 21/2-04 Шешімімен
title:
  rus: Түлкібас ауданы бойынша аз қамтамасыз етілген азаматтарға тұрғын үй көмегін беру Қағидасын бекіту туралы
