act_code: '49063'
requisite: Оңтүстік Қазақстан облысы Түлкібас ауданы әкімдігі Майлыкент ауылдық округі әкімінің 2009 жылғы 26 қарашадағы N 162 шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2009 жылғы 4 желтоқсанда N 14-14-91 тіркелді
