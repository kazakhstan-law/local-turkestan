act_code: '90390'
requisite: Решение № 40/3-05 от 25.05.2015, Маслихат Тюлькубасского района
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
