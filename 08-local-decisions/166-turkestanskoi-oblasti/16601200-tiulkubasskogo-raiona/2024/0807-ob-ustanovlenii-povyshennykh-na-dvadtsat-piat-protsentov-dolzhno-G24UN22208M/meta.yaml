requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 7 августа 2024 года № 22/2-08
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры, спорта, являющимся гражданскими служащими и работающим в сельской местности в государственных организациях, финансируемых из районного бюджета, по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет, спорт, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын мамандардың мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
