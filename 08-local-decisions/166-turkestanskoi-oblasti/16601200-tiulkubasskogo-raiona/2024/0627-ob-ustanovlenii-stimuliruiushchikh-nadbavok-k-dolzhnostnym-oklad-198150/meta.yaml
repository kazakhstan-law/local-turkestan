act_code: '198150'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 27 июня 2024 года № 20/5-08
title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников ГКУ "Түлкібас көрікті ел" отдела жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата Тюлькубасского района, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Түлкібас аудандық тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімінің «Түлкібас көрікті ел» КММ қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемақы белгілеу туралы
