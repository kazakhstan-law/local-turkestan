act_code: '120857'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 29 марта 2018 года № 25/14-06. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 апреля 2018 года № 4533
title:
  rus: О предоставлении в 2018 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
