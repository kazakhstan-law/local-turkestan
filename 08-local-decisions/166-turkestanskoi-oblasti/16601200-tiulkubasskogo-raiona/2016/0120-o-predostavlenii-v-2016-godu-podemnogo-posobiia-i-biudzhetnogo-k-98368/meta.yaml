act_code: '98368'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 20 января 2016 года № 47/5-05. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 28 января 2016 года № 3560
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
