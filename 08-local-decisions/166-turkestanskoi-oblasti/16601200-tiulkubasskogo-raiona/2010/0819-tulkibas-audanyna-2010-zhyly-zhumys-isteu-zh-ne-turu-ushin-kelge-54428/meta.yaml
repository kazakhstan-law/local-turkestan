act_code: '54428'
requisite: Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2010 жылғы 19 тамыздағы N 34/4-04 шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2010 жылғы 10 қыркүйекте N 14-14-115 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2011 жылғы 21 қазандағы N 46/2-04 Шешімімен
title:
  rus: Түлкібас ауданына 2010 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
