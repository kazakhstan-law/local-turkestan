requisite: Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2008 жылғы 25 желтоқсандағы N 14/12-04 шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2009 жылғы 23 қаңтарда N 14-14-63 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2009 жылғы 4 қарашадағы N 24/4-04 Шешімімен
