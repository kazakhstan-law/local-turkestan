  title:
    rus: О внесении изменении в решение Тюлькубасского районного маслихата от 14 апреля 2017 года № 13/4-06 «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Тюлькубасскому району
    kaz: Түлкібас аудандық мәслихатының 2017 жылғы 14 сәуірдегі № 13/4-06 «Түлкібас ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
