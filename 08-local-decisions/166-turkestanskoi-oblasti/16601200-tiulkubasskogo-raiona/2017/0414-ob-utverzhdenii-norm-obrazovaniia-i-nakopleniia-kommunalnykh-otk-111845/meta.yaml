act_code: '111845'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 14 апреля 2017 года № 13/4-06. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 2 мая 2017 года № 4082. Утратило силу решением Тюлькубасского районного маслихата Туркестанской области от 15 июня 2020 года № 55/11-06 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Тюлькубасскому району
  kaz: Түлкібас ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
