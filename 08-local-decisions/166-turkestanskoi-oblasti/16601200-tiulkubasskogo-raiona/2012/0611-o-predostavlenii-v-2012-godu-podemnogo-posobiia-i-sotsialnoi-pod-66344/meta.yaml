act_code: '66344'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 11 июня 2012 года № 5/9-05. Зарегистрировано Управлением юстиции Тюлькубасского района Южно-Казахстанской области 28 июня 2012 года № 14-14-171. Утратило силу в связи с истечением срока применения - (письмо Тюлькубасского районного маслихата Южно-Казахстанской области от 25 января 2013 года № 20)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
