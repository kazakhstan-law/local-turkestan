act_code: '70117'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 21 декабря 2012 года № 11/8-05. Зарегистрировано Департаментом юстиции  Южно-Казахстанской области 16 января 2013 года № 2209. Утратило силу в связи с истечением срока применения - (письмо Тюлькубасского районного маслихата Южно-Казахстанской области от 20 января 2014 года № 16)
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
