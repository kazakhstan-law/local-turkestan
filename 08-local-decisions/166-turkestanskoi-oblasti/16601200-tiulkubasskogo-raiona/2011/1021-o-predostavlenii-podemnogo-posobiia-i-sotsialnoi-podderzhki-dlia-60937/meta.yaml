act_code: '60937'
requisite: Решение маслихата Тюлькубасского района Южно-Казахстанской области от 21 октября 2011 года N 46/3-04. Зарегистрировано Управлением юстиции Тюлькубасского района Южно-Казахстанской области 26 октября 2011 года N 14-14-160
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения,  культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района на 2011 год
  kaz: Түлкібас ауданының ауылдық елді мекендерге 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру,  мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу  үшiн әлеуметтік қолдауды ұсыну туралы
