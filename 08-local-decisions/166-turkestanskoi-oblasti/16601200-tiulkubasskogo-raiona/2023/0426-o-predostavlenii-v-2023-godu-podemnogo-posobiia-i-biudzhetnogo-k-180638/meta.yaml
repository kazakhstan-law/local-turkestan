act_code: '180638'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 26 апреля 2023 года № 2/6-08
title:
  rus: О предоставлении в 2023 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья «специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты «Тюлькубасского района»
  kaz: Түлкібас ауданының «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2023 жылы» көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
