act_code: '208328'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 19 марта 2025 года № 31/2-08
title:
  rus: О предоставлении на 2025 год подъемного пособия и бюджетного кредита на приобретение или строительство жилья «специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты «Тюлькубасского района»
  kaz: Түлкібас ауданының «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері апппаратының мемлекеттік қызметшілеріне 2025 жылы» көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
