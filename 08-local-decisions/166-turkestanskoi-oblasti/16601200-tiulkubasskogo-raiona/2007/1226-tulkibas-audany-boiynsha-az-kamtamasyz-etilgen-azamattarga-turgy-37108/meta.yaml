act_code: '37108'
requisite: Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2007 жылғы 26 желтоқсандағы N 3/8-04 Шешімі. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2008 жылғы 22 қаңтарда N 14-14-43 тіркелді
