act_code: '131195'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 18 марта 2019 года № 37/8-06. Зарегистрировано Департаментом юстиции Туркестанской области 24 апреля 2019 года № 4993
title:
  rus: О предоставлении в 2019 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
