act_code: '130908'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 18 марта 2019 года № 37/9-06. Зарегистрировано Департаментом юстиции Туркестанской области 23 апреля 2019 года № 4987. Утратило силу решением Тюлькубасского районного маслихата Туркестанской области от 28 июня 2019 года № 42/2-06
title:
  rus: О предоставлении единовременной социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға біржолғы әлеуметтік көмек беру туралы
