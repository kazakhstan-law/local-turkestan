act_code: '86142'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 23 декабря 2014 года № 36/9-05. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 21 января 2015 года № 2967. Утратило силу решением Тюлькубасского районного маслихата Южно-Казахстанской области от 25 мая 2015 года № 40/2-05
title:
  rus: О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтiк қолдауды ұсыну туралы
