  title:
    rus: О внесении изменений в решение Тюлькубаского районного маслихата от 29 июля 2014 года № 31/2-05 « Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Тюлькубасском районе»
    kaz: Түлкібас аудандық мәслихатының 2014 жылғы 29 шілдедегі № 31/2-05 «Түлкібас ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
