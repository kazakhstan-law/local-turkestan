act_code: '82145'
requisite: Решение Тюлькубасского районного маслихата Южно-Казахстанской области от 29 июля 2014 года № 31/2-05. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 августа 2014 года № 2785. Утратило силу решением Тюлькубасского районного маслихата Туркестанской области от 27 сентября 2023 года № 7/7-08 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Тюлькубасском районе
  kaz: Түлкібас ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
