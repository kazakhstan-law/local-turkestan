act_code: '145250'
requisite: Решение Тюлькубасского районного маслихата Туркестанской области от 25 июня 2020 года № 55/10-06. Зарегистрировано Департаментом юстиции Туркестанской области 3 августа 2020 года № 5738
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Тюлькубасского района
  kaz: Түлкібас ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
