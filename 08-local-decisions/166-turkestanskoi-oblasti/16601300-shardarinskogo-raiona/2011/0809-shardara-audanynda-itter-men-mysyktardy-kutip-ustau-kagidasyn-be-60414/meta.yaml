act_code: '60414'
requisite: Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2011 жылғы 9 тамыздағы N 46-348-IV шешімі. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2011 жылғы 9 қыркүйекте N 14-15-119 тіркелді. Күші жойылды - Шардара аудандық мәслихатының 2012 жылғы 12 маусымдағы N 5-37-V Шешімімен
