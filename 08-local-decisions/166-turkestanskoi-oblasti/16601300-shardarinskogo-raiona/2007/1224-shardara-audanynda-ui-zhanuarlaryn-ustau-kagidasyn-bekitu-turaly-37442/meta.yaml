act_code: '37442'
requisite: Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2007 жылғы 24 желтоқсандағы N 4-18-IV шешімі. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2008 жылғы 22 қаңтарда N 14-15-51 тіркелді. Күші жойылды - Шардара аудандық мәслихатының 2010 жылғы 9 шілдедегі N 33-244-IV шешімімен
