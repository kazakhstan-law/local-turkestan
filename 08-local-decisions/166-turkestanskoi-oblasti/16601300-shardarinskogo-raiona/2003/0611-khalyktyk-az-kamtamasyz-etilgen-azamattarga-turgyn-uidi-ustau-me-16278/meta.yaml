requisite: Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2003 жылғы 12 маусымдағы N 23-178-II шешімі. Оңтүстік Қазақстан облысының Әділет басқармасында 2003 жылғы 15 шілдеде N 927 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2007 жылғы 24 желтоқсандағы N 4-27/IV Шешімімен
