act_code: '104843'
requisite: Решение Шардаринского районного маслихата Южно-Казахстанской области от 22 июня 2016 года № 4-36-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 15 июля 2016 года № 3782
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шардаринского района
  kaz: Шардара ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
