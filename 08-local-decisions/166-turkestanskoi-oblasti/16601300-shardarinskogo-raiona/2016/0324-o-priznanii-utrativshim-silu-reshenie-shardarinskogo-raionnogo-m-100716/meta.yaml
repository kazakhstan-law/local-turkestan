requisite: Решение Шардаринского районного маслихата Южно-Казахстанской области от 24 марта 2016 года № 1-7-VI
title:
  rus: О признании утратившим силу решение Шардаринского районного маслихата от 20 мая 2015 года № 41-245-V «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, захоронение и утилизацию коммунальных отходов по Шардаринскому району»
  kaz: Шардара аудандық мәслихатының 2015 жылғы 20 мамырдағы № 41-245-V «Шардара ауданы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, коммуналдық қалдықтарды жинау, әкету, көму және кәдеге жарату тарифтерін бекіту туралы» шешімінің күшін жою туралы
