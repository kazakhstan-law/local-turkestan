requisite: Решение Шардаринского районного маслихата Туркестанской области от 14 июня 2019 года № 44-278-VI. Зарегистрировано Департаментом юстиции Туркестанской области 24 июня 2019 года № 5092
title:
  rus: О предоставлении единовременной социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шардаринского района
  kaz: Шардара ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға біржолғы әлеуметтік көмек беру туралы
