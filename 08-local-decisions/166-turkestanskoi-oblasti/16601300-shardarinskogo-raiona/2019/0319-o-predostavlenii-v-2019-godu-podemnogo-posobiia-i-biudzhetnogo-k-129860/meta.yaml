  title:
    rus: О внесении изменения в решение Шардаринского районного маслихата от 19 марта 2019 года № 39-254-VІ «О предоставлении в 2019 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шардаринского района»
    kaz: Шардара аудандық мәслихатының 2019 жылғы 19 наурыздағы № 39-254-VI «Шардара ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгеріс енгізу туралы
