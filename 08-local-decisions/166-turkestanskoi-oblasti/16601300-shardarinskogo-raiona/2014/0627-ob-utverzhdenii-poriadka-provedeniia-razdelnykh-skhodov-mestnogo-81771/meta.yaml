  title:
    rus: О внесении изменении в решение Шардаринского районного маслихата от 27 июня 2014 года № 29-189-V «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей города районного значения, села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Шардаринском районе»
    kaz: Шардара аудандық мәслихатының 2014 жылғы 27 маусымдағы № 29-189-V «Шардара ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін аудандық маңызы бар қала, ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
