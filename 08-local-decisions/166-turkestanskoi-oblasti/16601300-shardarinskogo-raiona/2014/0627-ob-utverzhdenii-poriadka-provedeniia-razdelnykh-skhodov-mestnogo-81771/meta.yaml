act_code: '81771'
requisite: Решение Шардаринского районного маслихата Южно-Казахстанской области от 27 июня 2014 года № 29-189-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 1 августа 2014 года № 2751. Утратило силу решением Шардаринского районного маслихата Туркестанской области от 12 сентября 2023 года № 8-46-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей города районного значения, села,  микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Шардаринском районе
  kaz: Шардара ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін аудандық маңызы бар қала, ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
