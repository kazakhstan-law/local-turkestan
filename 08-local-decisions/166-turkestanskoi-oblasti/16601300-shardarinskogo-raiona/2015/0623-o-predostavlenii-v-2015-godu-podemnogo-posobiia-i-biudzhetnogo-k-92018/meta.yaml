act_code: '92018'
requisite: Решение Шардаринского районного маслихата Южно-Казахстанской области от 23 июня 2015 года № 42-254-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 20 июля 2015 года № 3249. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2016 жылғы 14 қаңтардағы № 9 хатымен)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шардаринского района
  kaz: Шардара ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
