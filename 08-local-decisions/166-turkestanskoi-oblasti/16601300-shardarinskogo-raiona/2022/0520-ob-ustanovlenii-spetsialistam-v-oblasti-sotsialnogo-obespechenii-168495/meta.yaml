act_code: '168495'
requisite: Решение Шардаринского районного маслихата Туркестанской области от 20 мая 2022 года № 18-114-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 июня 2022 года № 28349
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов повышенные на двадцать пять процентов оклады и тарифные ставки по сравнению со ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн  әлеуметтiк қамсыздандыру, мәдениет, спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын мамандардың мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
