act_code: '43760'
requisite: Оңтүстік Қазақстан облысы Шардара аудандық маслихатының 2009 жылғы 28 қаңтардағы N 15-110-IV шешімі. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2009 жылғы 18 ақпанда N 14-15-70 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара аудандық маслихатының 2009 жылғы 30 маусымдағы N 19-148-IV Шешімімен
