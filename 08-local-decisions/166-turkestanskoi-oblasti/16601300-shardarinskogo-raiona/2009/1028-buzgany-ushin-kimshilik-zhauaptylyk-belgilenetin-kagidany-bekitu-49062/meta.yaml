act_code: '49062'
requisite: Оңтүстік Қазақстан облысы Шардара ауданы мәслихатының 2009 жылғы 28 қазандағы N 23-171-IV шешімі. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2009 жылғы 3 желтоқсанда N 14-15-81 тіркелді. Күші жойылды - Шардара аудандық мәслихатының 2012 жылғы 12 маусымдағы N 5-37-V Шешімімен
