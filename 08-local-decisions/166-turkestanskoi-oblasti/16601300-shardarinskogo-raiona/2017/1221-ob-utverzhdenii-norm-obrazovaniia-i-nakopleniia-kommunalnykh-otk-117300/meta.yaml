act_code: '117300'
requisite: Решение Шардаринского районного маслихата Южно-Казахстанской области от 21 декабря 2017 года № 22-147-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 декабря 2017 года № 4340. Утратило силу постановлением акимата Мактааральского района Туркестанской области от 16 октября 2023 года № 573 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Шардаринскому району
  kaz: Шардара ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
