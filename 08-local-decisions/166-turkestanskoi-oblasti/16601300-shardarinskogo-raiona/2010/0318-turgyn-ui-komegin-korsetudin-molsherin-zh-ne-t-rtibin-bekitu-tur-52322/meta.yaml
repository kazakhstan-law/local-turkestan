act_code: '52322'
requisite: Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2010 жылғы 18 наурыздағы N 29-208-IV шешімі. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2010 жылғы 7 мамырда N 14-15-91 тіркелді. Күші жойылды - Шардара аудандық мәслихатының 2012 жылғы 17 сәуірдегі N 4-29-V Шешімімен
