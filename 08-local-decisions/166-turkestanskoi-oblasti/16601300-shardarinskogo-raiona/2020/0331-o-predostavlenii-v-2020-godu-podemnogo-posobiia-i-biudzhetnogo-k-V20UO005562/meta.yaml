requisite: Решение Шардаринского районного маслихата Туркестанской области от 31 марта 2020 года № 56-353-VI. Зарегистрировано Департаментом юстиции Туркестанской области 13 апреля 2020 года № 5562. Утратило силу решением Шардаринского районного маслихата Туркестанской области от 23 ноября 2020 года № 68-403-VI (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шардаринского района
  kaz: Шардара ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
