act_code: '223597'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 27 марта 2026 года № 40-244-VIІI
title:
  rus: Об установлении стимулирующей надбавки к должностным окладам работников КГУ «Мырзакент-Қызмет» и КГУ «Газ техническая служба и жилищные отношения» отдела «Жилищно-коммунальное хозяйство, пассажирский транспорт и автомобильные дороги и жилищная инспекция Мактааральского района», финансируемого из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Мақтаарал ауданының тұрғын-үй коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары және тұрғын үй инспекциясы» бөлімінің «Мырзакент-Қызмет» КММ және «Газ техникалық қызмет және тұрғын үй қатынастары» КММ қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемақы белгілеу туралы
