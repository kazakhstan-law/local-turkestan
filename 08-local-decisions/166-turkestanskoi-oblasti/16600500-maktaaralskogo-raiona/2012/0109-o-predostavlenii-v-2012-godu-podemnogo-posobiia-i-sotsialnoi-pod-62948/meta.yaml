requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 9 января 2012 года N 55-368-IV. Зарегистрировано Управлением юстиции Мактааральского района Южно-Казахстанской области 25 января 2012 года N 14-7-160
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам сфер здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт салаларының мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
