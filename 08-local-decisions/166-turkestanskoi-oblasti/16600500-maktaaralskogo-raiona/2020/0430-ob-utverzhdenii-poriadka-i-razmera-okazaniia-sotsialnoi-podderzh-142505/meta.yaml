act_code: '142505'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 30 апреля 2020 года № 64-400-VI. Зарегистрировано Департаментом юстиции Туркестанской области 4 мая 2020 года № 5591. Утратило силу решением Мактааральского районного маслихата Туркестанской области от 3 ноября 2023 года № 8-58-VIII (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы
