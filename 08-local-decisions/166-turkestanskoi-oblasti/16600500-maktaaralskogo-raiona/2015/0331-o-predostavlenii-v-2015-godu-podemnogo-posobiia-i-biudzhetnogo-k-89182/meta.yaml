act_code: '89182'
requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 31 марта 2015 года № 42-258-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 24 апреля 2015 года № 3156. Утратило силу в связи с истечением срока применения - (письмо аппарата Мактааральского районного маслихата Южно-Казахстанской области от 13 января 2016 года № 7)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
