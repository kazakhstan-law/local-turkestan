requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 28 января 2015 года № 39-237-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 февраля 2015 года № 3021. Утратило силу решением Мактааральского районного маслихата Южно-Казахстанской области от 31 марта 2015 года № 42-253-V
title:
  rus: О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтiк қолдауды ұсыну туралы
