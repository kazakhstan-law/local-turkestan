title:
  rus: 'О признании утратившим силу решения Мактааральского районного маслихата от 31 марта 2015 года №42-252-V «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, захоронение и утилизацию коммунальных отходов по Мактааральскому району» '
