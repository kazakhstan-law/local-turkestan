act_code: '165399'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 10 марта 2022 года № 18-101-VII
title:
  rus: О предоставлении в 2022 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы әлеуметтік қолдауды ұсыну туралы
