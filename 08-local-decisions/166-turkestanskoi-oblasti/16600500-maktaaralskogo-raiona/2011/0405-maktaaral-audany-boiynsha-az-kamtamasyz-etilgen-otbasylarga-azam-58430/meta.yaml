requisite: Оңтүстік Қазақстан облысы Мақтаарал аудандық мәслихатының 2011 жылғы 5 сәуірдегі N 44-301-IV шешімі. Оңтүстік Қазақстан облысы Мақтаарал ауданының Әділет басқармасында 2011 жылғы 27 сәуірде N 14-7-143 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Мақтаарал аудандық мәслихатының 2012 жылғы 30 наурыздағы N 3-13-V шешімімен
