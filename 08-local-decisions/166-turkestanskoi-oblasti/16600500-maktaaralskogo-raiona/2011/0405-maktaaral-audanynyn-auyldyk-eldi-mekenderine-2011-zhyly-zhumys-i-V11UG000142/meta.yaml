requisite: Оңтүстік Қазақстан облысы Мақтаарал аудандық мәслихатының 2011 жылғы 5 сәуірдегі N 44-300-IV шешімі. Оңтүстік Қазақстан облысы Мақтаарал ауданының Әділет басқармасында 2011 жылғы 26 сәуірде N 14-7-142 тіркелді
title:
  rus: Мақтаарал ауданының ауылдық елді мекендеріне 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
