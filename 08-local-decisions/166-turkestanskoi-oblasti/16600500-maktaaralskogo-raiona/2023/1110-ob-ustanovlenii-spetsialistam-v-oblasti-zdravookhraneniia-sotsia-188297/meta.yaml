act_code: '188297'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 10 ноября 2023 года № 9-62-VIІI. Утратило силу решением Мактааральского районного маслихата Туркестанской области от 6 мая 2025 года № 28-183-VIІI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета, повышенные на двадцать пять процентов оклады и тарифные ставки по сравнению со ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария саласындағы мамандарға, сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын мамандардың мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
