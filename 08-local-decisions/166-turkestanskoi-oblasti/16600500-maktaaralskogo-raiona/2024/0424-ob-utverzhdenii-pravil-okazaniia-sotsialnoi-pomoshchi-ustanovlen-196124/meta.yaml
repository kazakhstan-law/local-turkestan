  title:
    rus: О внесении изменений и дополнений в решение Мактааральского районного маслихата от 24 апреля 2024 года № 15-105-VIII «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Мақтаарал аудандық мәслихатының 2024 жылғы 24 сәуірдегі № 15-105-VIII «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
