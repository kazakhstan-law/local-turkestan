act_code: '195108'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 29 марта 2024 года № 14-93-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района в 2024 году
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау шараларын  көрсету туралы
