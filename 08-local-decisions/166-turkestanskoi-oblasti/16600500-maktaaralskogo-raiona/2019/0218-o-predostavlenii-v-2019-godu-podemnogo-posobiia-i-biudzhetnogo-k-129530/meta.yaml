act_code: '129530'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 18 февраля 2019 года № 46-300-VI. Зарегистрировано Департаментом юстиции Туркестанской области 5 марта 2019 года № 4922
title:
  rus: О предоставлении в 2019 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтаарал ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
