act_code: '109982'
requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 8 февраля 2017 года № 11-86-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 февраля 2017 года № 3981
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района
  kaz: Мақтарал ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
