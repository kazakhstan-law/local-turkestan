act_code: '111685'
requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 5 апреля 2017 года № 13-99-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 20 апреля 2017 года № 4066. Утратило силу решением Мактааральского районного маслихата Туркестанской области от 28 сентября 2022 года № 24-161-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Мактааральскому району
  kaz: Мақтарал ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
