act_code: '208684'
requisite: Решение Мактааральского районного маслихата Туркестанской области от 28 марта 2025 года № 26-169-VIІI
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2025 год
  kaz: Мақтаарал ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдау көрсету туралы
