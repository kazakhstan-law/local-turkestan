  title:
    rus: О внесении изменений в решение Мактааральского районного маслихата от 27 июня 2013 года № 17-99-V "О предоставлении социальной помощи на приобретение топлива специалистам государственных организации здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мактааральского района"
    kaz: Мақтаарал аудандық мәслихатының 2013 жылғы 27 маусымдағы № 17-99-V "Мақтаарал ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/86431/rus
