  requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 22 декабря 2017 года № 21-167-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 января 2018 года № 4408. Утратило силу решением Мактааральского районного маслихата Туркестанской области от 23 ноября 2018 года № 41-275-VI
  title:
    rus: О внесении изменения в решение Мактааральского районного маслихата от 27 июня 2013 года № 17-99-V «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мактааральского района»
    kaz: Мақтарал аудандық мәслихатының 2013 жылғы 27 маусымдағы № 17-99-V «Мақтаарал ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/118357/rus
