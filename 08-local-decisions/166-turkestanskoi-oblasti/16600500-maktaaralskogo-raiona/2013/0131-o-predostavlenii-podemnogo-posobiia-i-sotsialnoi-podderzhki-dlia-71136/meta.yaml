act_code: '71136'
requisite: Решение Мактааральского районного маслихата Южно-Казахстанской области от 31 января 2013 года № 13-69-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 25 февраля 2013 года № 2241
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Мактааральского района в 2013 году
  kaz: Мақтаарал ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн әлеуметтiк қолдауды ұсыну туралы
