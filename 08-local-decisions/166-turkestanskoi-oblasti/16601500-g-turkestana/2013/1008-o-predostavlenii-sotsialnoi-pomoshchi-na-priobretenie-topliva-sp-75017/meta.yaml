  title:
    rus: О внесении изменений в решение Туркестанского городского маслихата от 8 октября 2013 года № 19/115-V «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населеннных пунктах города Туркестан»
    kaz: Түркістан қалалық мәслихатының 2013 жылғы 8 қазандағы № 19/115-V "Түркістан қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
