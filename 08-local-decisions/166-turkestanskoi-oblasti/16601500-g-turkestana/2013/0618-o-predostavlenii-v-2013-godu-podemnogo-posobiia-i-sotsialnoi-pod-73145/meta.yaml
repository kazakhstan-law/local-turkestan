act_code: '73145'
requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 18 июня 2013 года № 14/92-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 27 июня 2013 года № 2319
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
