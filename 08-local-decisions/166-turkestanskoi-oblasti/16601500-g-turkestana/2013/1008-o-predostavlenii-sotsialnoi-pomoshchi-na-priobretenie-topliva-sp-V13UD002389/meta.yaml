requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 8 октября 2013 года № 19/115-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 октября 2013 года № 2389. Утратило силу решением Туркестанского городского маслихата Туркестанской области от 14 августа 2019 года № 51/253-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
