requisite: Оңтүстік Қазақстан облысы Түркістан қалалық мәслихатының 2009 жылғы 23 ақпандағы N 16/117-IV шешімі. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2009 жылғы 25 наурызда N 14-4-62 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түркістан қалалық мәслихатының 2011 жылғы 24 маусымдағы № 46/311-IV шешімімен
