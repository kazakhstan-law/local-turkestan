requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 9 февраля 2018 года № 27/145-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 февраля 2018 года № 4461. Утратило силу решением Туркестанского городского маслихата Туркестанской области от 11 августа 2023 года № 5/27-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Туркестан
  kaz: Түркістан қаласы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
