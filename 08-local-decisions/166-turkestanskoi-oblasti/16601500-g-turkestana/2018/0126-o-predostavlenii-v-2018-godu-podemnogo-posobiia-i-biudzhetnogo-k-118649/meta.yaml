act_code: '118649'
requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 26 января 2018 года № 26/141-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 января 2018 года № 4430
title:
  rus: О предоставлении в 2018 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
