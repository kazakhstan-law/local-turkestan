act_code: '59266'
requisite: Оңтүстік Қазақстан облысы Түркістан қалалық мәслихатының 2011 жылғы 27 мамырдағы N 44/299-IV шешімі. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2011 жылғы 20 маусымда N 14-4-99 тіркелді
title:
  rus: Түркістан қаласының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдау шараларын ұсыну туралы
  kaz: Түркістан қаласының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдау шараларын ұсыну туралы
