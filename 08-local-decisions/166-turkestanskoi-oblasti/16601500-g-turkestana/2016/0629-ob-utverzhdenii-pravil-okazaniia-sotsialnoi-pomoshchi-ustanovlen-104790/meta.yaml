  title:
    rus: О внесении изменений в решение Туркестанского городского маслихата от 29 июня 2016 года № 5/21-VI «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Туркестан»
    kaz: Түркістан қалалық мәслихатының 2016 жылғы 29 маусымдағы № 5/21-VI «Түркістан қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
