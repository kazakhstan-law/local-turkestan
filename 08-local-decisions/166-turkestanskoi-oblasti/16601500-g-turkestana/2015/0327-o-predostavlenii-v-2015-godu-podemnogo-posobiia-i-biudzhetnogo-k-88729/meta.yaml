requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 27 марта 2015 года № 40/227-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 апреля 2015 года № 3121. Утратило силу в связи с истечением срока применения - (письмо Туркестанского городского маслихата Южно-Казахстанской области от 31 декабря 2015 года № 01-10/315)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркөсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
