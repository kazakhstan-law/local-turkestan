  title:
    rus: О внесении изменений и дополнений в решение Туркестанского городского маслихата от 11 января 2012 года № 53/359-IV "О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты города Туркестан на 2012 год"
    kaz: Түркістан қалалық мәслихатының 2012 жылғы 11 қаңтардағы № 53/359-IV "Түркістан қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
