act_code: '62877'
requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 11 января 2012 года N 53/359-IV. Зарегистрировано Управлением юстиции города Туркестан Южно-Казахстанской области 24 января 2012 года N 14-4-112
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы әлеуметтік қолдау шараларын ұсыну туралы
