act_code: '111471'
requisite: Решение Туркестанского городского маслихата Южно-Казахстанской области от 17 апреля 2017 года № 15/86-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 апреля 2017 года № 4049
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Туркестан
  kaz: Түркістан қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
