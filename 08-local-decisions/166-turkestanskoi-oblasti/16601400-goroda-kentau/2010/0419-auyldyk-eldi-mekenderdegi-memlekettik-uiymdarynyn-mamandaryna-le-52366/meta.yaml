requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2010 жылғы 19 сәуірдегі N 220 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2010 жылғы 11 мамырда N 14-3-88 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2013 жылғы 29 наурыздағы № 84 шешімімен
