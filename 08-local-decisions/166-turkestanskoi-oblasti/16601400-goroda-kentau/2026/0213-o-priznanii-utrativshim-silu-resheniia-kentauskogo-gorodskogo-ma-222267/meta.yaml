title:
  rus: О признании утратившим силу решения Кентауского городского маслихата от 12 марта 2024 года № 93 «О понижении размера ставки налогов при применении специального налогового режима розничного налога в городе Кентау»
  kaz: «Кентау қаласында бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» Кентау қалалық мәслихатының 2024 жылғы 12 наурыздағы № 93 шешімінің күшін жою туралы
