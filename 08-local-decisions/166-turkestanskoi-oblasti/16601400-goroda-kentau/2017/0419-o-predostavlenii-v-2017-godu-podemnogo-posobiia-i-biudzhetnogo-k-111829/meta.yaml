act_code: '111829'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 19 апреля 2017 года № 78. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 мая 2017 года № 4090
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Кентау
  kaz: Кентау қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен  саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
