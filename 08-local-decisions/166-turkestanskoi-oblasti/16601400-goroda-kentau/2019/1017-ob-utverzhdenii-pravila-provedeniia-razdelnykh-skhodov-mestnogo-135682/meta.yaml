  requisite: Решение Кентауского городского маслихата Туркестанской области от 4 февраля 2022 года № 113. Утратило силу решением Кентауского городского маслихата Туркестанской области от 15 декабря 2023 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение Кентауского городского маслихата от 17 октября 2019 года № 308 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в городе Кентау»
    kaz: Кентау қалалық мәслихатының 2019 жылғы 17 қазандағы № 308 «Кентау қаласында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
