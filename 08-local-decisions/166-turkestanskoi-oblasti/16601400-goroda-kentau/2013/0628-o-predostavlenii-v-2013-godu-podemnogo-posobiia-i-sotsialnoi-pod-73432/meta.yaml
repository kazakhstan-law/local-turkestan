act_code: '73432'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 28 июня 2013 года № 100. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 июля 2013 года № 2325
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Кентау
  kaz: Кентау қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
