  title:
    rus: О внесении изменения в решение Кентауского городского маслихата от 12 марта 2024 года № 94 «О предоставлении в 2024 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Кентау»
    kaz: Кентау қалалық мәслихатының 2024 жылғы 12 наурыздағы № 94 «Кентау қаласының ауылдық елді мекендерде жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы» шешіміне өзгерістер енгізу туралы
