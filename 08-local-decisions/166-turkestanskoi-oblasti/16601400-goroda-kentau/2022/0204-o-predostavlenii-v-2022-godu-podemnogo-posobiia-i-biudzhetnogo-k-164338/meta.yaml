act_code: '164338'
requisite: Решение Кентауского городского маслихата Туркестанской области от 4 февраля 2022 года № 118
title:
  rus: О предоставлении в 2022 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Кентау
  kaz: Кентау қаласының ауылдық елді мекендерде жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы көтерме  жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
