title:
  rus: О признании утратившим силу решения Кентауского городского маслихата от 5 декабря 2017 года № 114 «Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность на территории города Кентау»
  kaz: Кентау қалалық мәслихатының 2017 жылғы 5 желтоқсандағы № 114 «Кентау қаласы аумағында сот шешімімен коммуналдық меншікке түскен болып танылған иесіз қалдықтарды басқару Қағидаларын бекіту туралы» шешімінің күшін жою деп тану туралы
