    kaz: Кентау қалалық мәслихатының 2016 жылғы 19 шілдедегі № 31 «Кентау қаласының әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
