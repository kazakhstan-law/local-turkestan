act_code: '106600'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 29 сентября 2016 года № 48
title:
  rus: О признании утратившим силу решение Кентауского маслихата от 30 марта 2016 года №13 «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, захоронение и утилизацию твердых бытовых отходов по городу Кентау»
  kaz: «Кентау қаласы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинау, әкету, көму және кәдеге жарату тарифтерін бекіту туралы» Кентау қалалық мәслихатының 2016 жылғы 30 наурыздағы №13 шешімінің күшін жою туралы
