act_code: '100473'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 26 февраля 2016 года № 297. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 24 марта 2016 года № 3657
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Кентау
  kaz: Кентау қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
