act_code: '98670'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 4 февраля 2016 года № 293
title:
  rus: О признании утратившим силу решение Кентауского маслихата от 30 сентября 2015 года № 258 «О повышении ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения на территории города Кентау»
  kaz: «Кентау қаласының аумағында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемелерін  жоғарылату туралы» Кентау қалалық мәслихатының 2015 жылғы 30 қыркүйектегі № 258 шешімінің күшін жою туралы
