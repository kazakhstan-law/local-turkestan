act_code: '45513'
requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2009 жылғы 31 наурыздағы N 134 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2009 жылғы 29 сәуірде N 14-3-71 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2012 жылғы 4 желтоқсандағы № 68 Шешімімен
