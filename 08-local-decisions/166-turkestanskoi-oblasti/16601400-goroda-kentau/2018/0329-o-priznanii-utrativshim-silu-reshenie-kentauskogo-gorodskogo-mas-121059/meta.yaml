requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 29 марта 2018 года № 146. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 апреля 2018 года № 4542
title:
  rus: О признании утратившим силу решение Кентауского городского маслихата от 28 июня 2016 года № 20 «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения на территории города Кентау»
  kaz: Кентау қалалық мәслихатының 2016 жылғы 28 маусымдағы № 20 «Кентау қаласының аумағында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерге жер салығының базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күшін жою туралы
