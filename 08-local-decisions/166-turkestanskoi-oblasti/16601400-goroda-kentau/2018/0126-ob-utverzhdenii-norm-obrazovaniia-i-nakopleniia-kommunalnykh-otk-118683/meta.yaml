  title:
    rus: О внесении изменений в решение Кентауского городского маслихата от 26 января 2018 года № 129 «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Кентау»
    kaz: Кентау қалалық мәслихатының 2018 жылғы 26 қаңтардағы № 129 «Кентау қаласы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
