act_code: '118683'
requisite: Решение Кентауского городского маслихата Южно-Казахстанской области от 26 января 2018 года № 129. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 12 февраля 2018 года № 4450. Утратило силу решением Кентауского городского маслихата Туркестанской области от 27 июня 2024 года № 123 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Кентау
  kaz: Кентау қаласы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
