act_code: '42349'
requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2008 жылғы 7 қарашадағы № 105 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2008 жылғы 20 қарашада № 14-3-65 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2015 жылғы 27 наурыздағы № 228 шешімімен
