act_code: '38984'
requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2008 жылғы 26 наурыздағы N 55 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2008 жылғы 15 сәуірде N 14-3-58 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қаласы мәслихатының 2009 жылғы 26 маусымдағы N 158 шешімімен
