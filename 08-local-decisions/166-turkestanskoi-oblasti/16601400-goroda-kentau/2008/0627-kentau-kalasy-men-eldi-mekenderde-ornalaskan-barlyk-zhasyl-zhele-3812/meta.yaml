requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2008 жылғы 27 маусымдағы N 73 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2008 жылғы 25 шілдеде N 14-3-62 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қаласы мәслихатының 2012 жылғы 29 тамыздағы N 48 шешімімен
