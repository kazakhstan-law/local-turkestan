requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2008 жылғы 27 маусымдағы N 72 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2008 жылғы 25 шілдеде N 14-3-61 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2010 жылғы 22 желтоқсандағы N 270 Шешімімен
