act_code: '148062'
requisite: Решение Кентауского городского маслихата Туркестанской области от 13 октября 2020 года № 388. Зарегистрировано Департаментом юстиции Туркестанской области 29 октября 2020 года № 5866
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Кентау
  kaz: Кентау қаласының ауылдық елді мекендерде жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
