requisite: Оңтүстiк Қазақстан облысы Кентау қалалық мәслихатының 2007 жылғы 10 қазандағы № 15 шешiмi. Оңтүстiк Қазақстан облысы Кентау қаласының Әділет басқармасында 2007 жылғы 6 қарашада № 14-3-48 болып тiркелдi
