act_code: '30639'
requisite: Оңтүстік Қазақстан облысы Кентау қалалық мәслихатының 2006 жылғы 4 желтоқсандағы № 207 шешімі. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2006 жылы 14 желтоқсанда № 14-3-34 болып тіркелді
