act_code: '91804'
requisite: Решение от 16.07.2015 № 243, Маслихат города Кентау
title:
  rus: О признании утратившим силу решение Кентауского маслихата от 27 марта 2015 года № 229 «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, захоронение и утилизацию коммунальных отходов по городу Кентау»
  kaz: «Кентау қаласы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, коммуналдық қалдықтарды жинау, әкету, көму және кәдеге жарату тарифтерін бекіту туралы» Кентау қалалық мәслихатының 2015 жылғы 27 наурыздағы № 229 шешімінің күшін жою туралы
