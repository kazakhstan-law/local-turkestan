    rus: О снятии ограничительных мероприятий и признании утратившим силу решение акима Киелитасского сельского округа Толебийского района от 13 апреля 2021 года № 7 «Об установлении ограничительных мероприятий по бруцелезу на улице Бадам в населенном пункте Султанрабат Киелитасского сельского округа»
    kaz: Шектеу іс-шараларын тоқтату және Төлеби ауданы Киелітас ауылдық округі әкімінің 2021 жылғы 13 сәуірдегі № 7 «Киелітас ауылдық округі Сұлтанрабат елді мекені Бадам көшесінде бруцеллез ауруы бойынша шектеу шараларын белгілеу туралы» шешімінің күші жойылды деп тану туралы
