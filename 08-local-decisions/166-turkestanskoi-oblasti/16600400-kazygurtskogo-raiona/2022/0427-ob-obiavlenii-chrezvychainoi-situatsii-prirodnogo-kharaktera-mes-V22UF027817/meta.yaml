requisite: Решение акима Казыгуртского района Туркестанской области от 27 апреля 2022 года № 8. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 апреля 2022 года № 27817. Утратило силу решением акима Казыгуртского района Туркестанской области от 5 октября 2022 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
