act_code: '51787'
requisite: Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2010 жылғы 18 наурыздағы N 31/232-IV шешімі. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2010 жылғы 16 сәуірде N 14-6-97 тіркелді
title:
  rus: Қазығұрт ауданына 2010 жылы  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
