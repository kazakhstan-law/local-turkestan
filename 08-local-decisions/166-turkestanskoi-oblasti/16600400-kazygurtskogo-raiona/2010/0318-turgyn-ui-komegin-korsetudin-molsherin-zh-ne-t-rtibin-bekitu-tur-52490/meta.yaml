requisite: Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2010 жылғы 18 наурыздағы N 31/226-IV шешімі. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2010 жылғы 13 мамырда N 14-6-101 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2012 жылғы 15 маусымдағы N 6/40-V шешімімен
