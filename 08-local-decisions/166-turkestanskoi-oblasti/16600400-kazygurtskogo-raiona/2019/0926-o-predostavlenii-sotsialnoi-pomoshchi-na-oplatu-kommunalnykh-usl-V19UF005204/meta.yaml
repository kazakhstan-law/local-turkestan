requisite: Решение Казыгуртского районного маслихата Туркестанской области от 26 сентября 2019 года № 48/300-VI. Зарегистрировано Департаментом юстиции Туркестанской области 8 октября 2019 года № 5204. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 27 февраля 2020 года № 54/335-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға әлеуметтік көмек беру туралы
