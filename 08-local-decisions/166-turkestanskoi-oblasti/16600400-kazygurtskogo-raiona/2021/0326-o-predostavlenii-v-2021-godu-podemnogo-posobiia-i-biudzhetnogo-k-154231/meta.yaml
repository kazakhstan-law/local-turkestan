act_code: '154231'
requisite: Решение Казыгуртского районного маслихата Туркестанской области от 26 марта 2021 года № 6/27-VII. Зарегистрировано Департаментом юстиции Туркестанской области 2 апреля 2021 года № 6138
title:
  rus: О предоставлении в 2021 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
