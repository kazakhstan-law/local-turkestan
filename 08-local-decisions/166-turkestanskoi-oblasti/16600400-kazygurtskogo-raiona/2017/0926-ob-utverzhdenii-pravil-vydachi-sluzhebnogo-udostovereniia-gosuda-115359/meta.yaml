requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 26 сентября 2017 года № 19/116-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 октября 2017 года № 4233. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 18 октября 2023 года № 6/41-VIII (вводится в действие по истечении десяти календарных дней после дня его первого оаубликования)
title:
