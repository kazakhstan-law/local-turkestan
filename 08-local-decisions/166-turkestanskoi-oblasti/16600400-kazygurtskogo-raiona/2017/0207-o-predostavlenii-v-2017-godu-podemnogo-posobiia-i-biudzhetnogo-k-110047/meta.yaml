act_code: '110047'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 7 февраля 2017 года № 13/76-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 февраля 2017 года № 3978
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или стройтельства жилья специалистам в области здравоохранения, образания, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
