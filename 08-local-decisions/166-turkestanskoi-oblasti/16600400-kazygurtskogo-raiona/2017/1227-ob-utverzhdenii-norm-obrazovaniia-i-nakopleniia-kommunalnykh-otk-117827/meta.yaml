  title:
    rus: О внесении изменении в решение Казыгуртского районного маслихата от 27 декабря 2017 года № 25/153–VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Казыгуртскому району»
    kaz: Қазығұрт аудандық мәслихатының 2017 жылғы 27 желтоқсандағы № 25/153-VI «Қазығұрт ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
