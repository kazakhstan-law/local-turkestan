  requisite: Решение Казыгуртского районного маслихата Туркестанской области от 28 марта 2019 года № 42/272-VI. Зарегистрировано Департаментом юстиции Туркестанской области 10 апреля 2019 года № 4972. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 21 февраля 2024 года № 11/78-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение Казыгуртского районного маслихата от 27 декабря 2017 года № 25/153-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Казыгуртскому району»
    kaz: Қазығұрт аудандық мәслихатының 2017 жылғы 27 желтоқсандағы № 25/153-VI «Қазығұрт ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
