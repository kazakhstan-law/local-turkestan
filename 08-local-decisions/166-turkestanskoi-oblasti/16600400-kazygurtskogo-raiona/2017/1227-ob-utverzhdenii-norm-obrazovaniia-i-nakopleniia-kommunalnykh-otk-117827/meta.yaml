act_code: '117827'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 27 декабря 2017 года № 25/153-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 января 2018 года № 4388. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 21 февраля 2024 года № 11/78-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Казыгуртскому району
  kaz: Қазығұрт ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
