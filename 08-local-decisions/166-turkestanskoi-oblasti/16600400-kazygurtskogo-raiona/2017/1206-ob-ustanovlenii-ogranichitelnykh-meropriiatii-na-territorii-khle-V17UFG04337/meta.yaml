    kaz: Қарабау ауылы округі әкімінің 2017 жылғы 6 желтоқсандағы № 35 «Қарабау ауылы округі, Үшбұлақ ауылындағы «Жаңабай» өндірістік кооперативінің қорасының аумағына шектеу іс-шараларын белгілеу туралы» шешімінің күші жойылды деп тану туралы.
