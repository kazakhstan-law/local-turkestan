title:
  rus: Об установлении стимулирующей надбавки к должностным окладам работников КГУ "Жарык-жол және саябақтары" отдела жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата Казыгуртского района, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Қазығұрт ауданы әкімдігінің тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімінің "Жарық-жол және саябақтары" КММ қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемақы белгілеу туралы
