title:
  rus: Об установлении стимулирующей надбавки специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға ынталандыру үстемақы белгілеу туралы
