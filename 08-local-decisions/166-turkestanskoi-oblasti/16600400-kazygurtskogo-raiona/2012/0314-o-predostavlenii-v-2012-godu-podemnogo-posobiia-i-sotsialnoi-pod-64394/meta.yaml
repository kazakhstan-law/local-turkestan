act_code: '64394'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 14 марта 2012 года № 3/25-V. Зарегистрировано Управлением юстиции Казыгуртского района Южно-Казахстанской области 5 апреля 2012 года № 14-6-159. Утратило силу в связи с истечением срока применения - (письмо Казыгуртского районного маслихата Южно-Казахстанской области от 1 февраля 2013 года № 16)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
