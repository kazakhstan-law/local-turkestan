title:
  rus: О снятии ограничительных мероприятий и признании утратившим силу решение акима сельского округа Казыгурт от 17 января 2020 года № 3 «Об установлении ограничительных мер во дворе дома № 10 улице Телемунара, сельского округа Казыгурт, Казыгуртского района»
