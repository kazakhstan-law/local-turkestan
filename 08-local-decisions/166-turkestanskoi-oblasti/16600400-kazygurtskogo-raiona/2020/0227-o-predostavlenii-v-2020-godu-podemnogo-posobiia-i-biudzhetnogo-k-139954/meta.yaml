act_code: '139954'
requisite: Решение Казыгуртского районного маслихата Туркестанской области от 27 февраля 2020 года № 54/333-VI. Зарегистрировано Департаментом юстиции Туркестанской области 2 марта 2020 года № 5459
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
