act_code: '184968'
requisite: Решение Казыгуртского районного маслихата Туркестанской области от 11 августа 2023 года № 5/30-VIII
title:
  rus: О предоставлении в 2023 подъемного пособия и бюджетного кредита на приобретение или строительство жилья в специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратовакимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2023 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
