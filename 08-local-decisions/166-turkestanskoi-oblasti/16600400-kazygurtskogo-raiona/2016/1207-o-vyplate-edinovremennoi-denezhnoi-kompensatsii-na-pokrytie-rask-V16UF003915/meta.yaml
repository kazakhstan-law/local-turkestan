  title:
    rus: О признании утратившим силу решения Казыгуртского районного маслихата от 7 декабря 2016 года № 11/58-VІ «О выплате единовременной денежной компенсаций на покрытие расходов за коммунальные услуги педагогическим работникам образования, работающим в сельской местности за счет средств местного бюджета»
    kaz: Қазығұрт аудандық мәслихатының 2016 жылғы 7 желтоқсандағы № 11/58-VI «Ауылдық жерде жұмыс істейтін білім берудің педагог қызметкерлеріне коммуналдық қызмет көрсетулерге шығыстарды жабуға жергілікті бюджет қаражаты есебінен біржолғы ақшалай өтемақы төлеу туралы» шешімінің күші жойылды деп тану туралы
