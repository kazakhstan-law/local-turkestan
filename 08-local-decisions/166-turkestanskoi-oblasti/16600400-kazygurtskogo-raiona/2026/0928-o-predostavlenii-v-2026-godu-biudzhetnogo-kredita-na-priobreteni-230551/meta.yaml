act_code: '230551'
requisite: Решение маслихата Казыгуртского района Туркестанской области от 28 сентября 2026 года № 45/266-VIII
title:
  rus: О предоставлении в 2026 году бюджетного кредита на приобретение или строительство жилья специалистам  в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылы тұрғын үй сатып алу немесе  салу үшін бюджеттік кредит беру туралы
