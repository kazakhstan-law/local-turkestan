requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 30 марта 2015 года № 42/292-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 апреля 2015 года № 3135. Утратило силу в связи с истечением срока применения - (письмо Казыгуртского районного маслихата Южно-Казахстанской области от 22 января 2016 года № 14)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
