title:
  rus: Об отмене решения Казыгуртского районного маслихата №40/262-V от 24 декабря 2014 года «Об утверждении норм образования, накопления коммунальных отходов и тарифов на сбор, вывоз, захоронение, утилизацию коммунальных отходов по Казыгуртскому району»
  kaz: 'Қазығұрт аудандық мәслихатының 2014 жылғы 24 желтоқсандағы «Қазығұрт ауданы бойынша коммуналдық қалдықтардың қалыптасу, жинақталу нормаларын және коммуналдық қалдықтарды жинау, әкету, көму, кәдеге жарату тарифтерін бекіту туралы» №40/262-V шешімінің күшін жою туралы '
