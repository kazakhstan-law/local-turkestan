act_code: '87160'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 27 января 2015 года № 41/276-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 февраля 2015 года № 3034. Утратило силу решением Казыгуртского районного маслихата Южно-Казахстанской области от 30 марта 2015 года № 42/288-V
title:
  rus: О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образания, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
