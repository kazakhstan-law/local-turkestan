act_code: '45908'
requisite: Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2009 жылғы 3 сәуірдегі N 18/138-IV шешімі. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2009 жылғы 12 мамырда N 14-6-73 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2012 жылғы 20 желтоқсандағы № 12/89-V Шешімімен
