act_code: '77364'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 22 января 2014 года № 27/181-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 12 февраля 2014 года № 2526. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 7 ноября 2023 года № 7/46-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества в Казыгуртском районе
  kaz: Қазығұрт ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын бекіту туралы
