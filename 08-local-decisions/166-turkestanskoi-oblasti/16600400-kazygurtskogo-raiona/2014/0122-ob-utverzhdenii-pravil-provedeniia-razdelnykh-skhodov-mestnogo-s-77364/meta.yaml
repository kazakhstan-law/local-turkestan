  requisite: Решение Казыгуртского районного маслихата Туркестанской области от 23 ноября 2021 года № 17/75-VII. Утратило силу решением Казыгуртского районного маслихата Туркестанской области от 7 ноября 2023 года № 7/47-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Казыгуртского районного маслихата от 22 января 2014 года № 27/181-V «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Казыгуртском районе»
    kaz: Қазығұрт аудандық мәслихатының 2014 жылғы 22 қаңтардағы № 27/181-V «Қазығұрт ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
