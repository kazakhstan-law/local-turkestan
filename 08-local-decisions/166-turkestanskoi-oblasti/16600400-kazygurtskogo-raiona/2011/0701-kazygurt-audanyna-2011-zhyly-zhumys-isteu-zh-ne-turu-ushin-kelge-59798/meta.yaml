act_code: '59798'
requisite: Оңтүстік Қазақстан облысы Қазығұрт аудандық мәслихатының 2011 жылғы 1 шілдедегі N 44/344-IV шешімі. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2011 жылғы 25 шілдеде N 14-6-139 тіркелді
title:
  rus: Қазығұрт ауданына 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
  kaz: Қазығұрт ауданына 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
