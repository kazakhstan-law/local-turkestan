act_code: '118540'
requisite: Решение Казыгуртского районного маслихата Южно-Казахстанской области от 24 января 2018 года № 26/156-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 2 февраля 2018 года № 4442
title:
  rus: О предоставлении в 2018 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
