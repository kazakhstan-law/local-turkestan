act_code: '198680'
requisite: Решение Казыгуртского районного маслихата Туркестанской области от 10 июля 2024 года № 15/103-VIII
title:
  rus: О предоставлении в 2024 подъемного пособия и бюджетного кредита на приобретение или строительство жилья в специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казыгуртского района
  kaz: Қазығұрт ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру,мәдениет, спорт және агро өнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2024 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
