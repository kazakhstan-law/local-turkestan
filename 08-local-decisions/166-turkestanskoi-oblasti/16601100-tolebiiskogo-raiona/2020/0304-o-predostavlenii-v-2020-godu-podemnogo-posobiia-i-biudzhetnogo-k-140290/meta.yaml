  title:
    rus: О внесении изменений в решение Толебийского районного маслихата от 4 марта 2020 года № 50/276-VI «О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Толебийского района»
    kaz: Төлеби аудандық мәслихатының 2020 жылғы 4 наурыздағы № 50/276-VI «Төлеби ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгерістер енгізу туралы
