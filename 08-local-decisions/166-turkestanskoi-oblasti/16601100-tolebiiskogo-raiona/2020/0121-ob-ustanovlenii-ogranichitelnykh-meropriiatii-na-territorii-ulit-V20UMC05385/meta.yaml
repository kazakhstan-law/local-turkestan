  title:
    rus: О снятии ограничительных мероприятий и признании утратившим силу решение акима сельского округа Аккум от 21 января 2020 года № 02 «Об установлении ограничительных мероприятий на улице Коктерек в населенном пункте Жанауйым сельского округа Аккум Толебийского района»
    kaz: Шектеу іс-шараларын алып тастау және Төлеби ауданы әкімдігінің Аққұм ауылдық округі әкімінің 2020 жылғы 21 қаңтардағы № 02 «Аққұм ауылдық округі Жаңаұйым ауылы Көктерек көшесіне шектеу іс-шараларын белгілеу туралы» шешімінің күшін жою туралы
