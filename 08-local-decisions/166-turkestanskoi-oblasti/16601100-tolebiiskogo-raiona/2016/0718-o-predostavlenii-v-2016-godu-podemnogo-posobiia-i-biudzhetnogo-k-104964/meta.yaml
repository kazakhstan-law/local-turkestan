act_code: '104964'
requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 18 июля 2016 года № 6/27-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 июля 2016 года № 3806
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
