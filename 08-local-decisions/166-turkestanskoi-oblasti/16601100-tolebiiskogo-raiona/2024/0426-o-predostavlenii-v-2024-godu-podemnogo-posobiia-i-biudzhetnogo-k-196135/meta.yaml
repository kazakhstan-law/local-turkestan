act_code: '196135'
requisite: Решение Толебийского районного маслихата Туркестанской области от 26 апреля 2024 года № 12/72-VIII
title:
  rus: О предоставлении в 2024 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы көтерме жәрдемақы және тұрғын  үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
