  title:
    rus: О внесении изменения в решение Толебийского районного маслихата от 21 июля 2015 года № 42/207-V «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Толебийском районе»
    kaz: Төлеби аудандық мәслихатының 2015 жылғы 21 шілдедегі №42/207-V «Төлеби ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
