act_code: '93108'
requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 21 июля 2015 года № 42/207-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 августа 2015 года № 3314. Утратило силу решением Толебийского районного маслихата Туркестанской области от 14 августа 2024 года № 15/87-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Толебийском районе
  kaz: Төлеби ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
