requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 22 июня 2012 года № 6/32-V. Зарегистрировано Управлением юстиции Толебийского района Южно-Казахстанской области 4 июля 2012 года № 14-13-108. Утратило силу в связи с истечением срока применения - (письмо Толебийского районного маслихата Южно-Казахстанской области от 28 декабря 2012 года № 181)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет спорт және ветеринария мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
