act_code: '111953'
requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 19 апреля 2017 года № 14/80-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 28 апреля 2017 года № 4080. Утратило силу решением Толебийского районного маслихата Туркестанской области от 19 сентября 2018 года № 29/165-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының  мамандарына отын сатып алуға әлеуметтік көмек беру туралы
