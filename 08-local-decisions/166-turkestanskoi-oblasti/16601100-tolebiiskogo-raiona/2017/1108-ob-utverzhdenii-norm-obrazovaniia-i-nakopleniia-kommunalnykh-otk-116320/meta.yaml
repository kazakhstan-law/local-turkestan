act_code: '116320'
requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 8 ноября 2017 года № 19/103-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 ноября 2017 года № 4275. Утратило силу решением Толебийского районного маслихата Туркестанской области от 18 августа 2023 года № 4/29-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Толебийскому району
  kaz: Төлеби ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
