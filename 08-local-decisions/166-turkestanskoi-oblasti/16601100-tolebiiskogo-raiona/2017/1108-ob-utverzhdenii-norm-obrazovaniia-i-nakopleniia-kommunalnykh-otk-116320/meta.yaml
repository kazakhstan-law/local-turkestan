  title:
    rus: О внесении изменений в решение Толебийского районного маслихата от 8 ноября 2017 года № 19/103-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Толебийскому району»
    kaz: Төлеби аудандық мәслихатының 2017 жылғы 8 қарашадағы № 19/103-VI «Төлеби ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
