requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 29 марта 2017 года № 13/68-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 апреля 2017 года № 4032
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік      кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
