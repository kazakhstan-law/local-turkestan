act_code: '71183'
requisite: Решение Толебийского районного маслихата Южно-Казахстанской области от 31 января 2013 года № 14/73-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 28 февраля 2013 года № 2243
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдауды ұсыну туралы
