title:
  rus: О признании утратившим силу решение Толебийского районного маслихата от 25 декабря 2017 года № 21/114-VI «Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Толебийского района»
  kaz: Төлеби аудандық мәслихатының 2017 жылғы 25 желтоқсандағы № 21/114-VІ «Сот шешімімен Төлеби ауданының коммуналдық меншігіне түскен болып танылған иесіз қалдықттарды басқару Қағидаларын бекіту туралы» шешімінің күшін жою туралы
