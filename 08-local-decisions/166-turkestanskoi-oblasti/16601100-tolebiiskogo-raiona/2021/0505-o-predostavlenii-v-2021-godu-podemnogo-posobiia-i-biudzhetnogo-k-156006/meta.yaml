act_code: '156006'
requisite: Решение Толебийского районного маслихата Туркестанской области от 5 мая 2021 года № 4/27-VII. Зарегистрировано Департаментом юстиции Туркестанской области 19 мая 2021 года № 6223. Утратило силу решением Толебийского районного маслихата Туркестанской области от 3 ноября 2021 года № 11/64-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2021 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Толебийского района
  kaz: Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2021 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
