act_code: '160150'
requisite: Решение Толебийского районного маслихата Туркестанской области от 3 ноября 2021 года № 11/64-VI
title:
  rus: О признании утратившим силу решение Толебийского районного маслихата от 25 мая 2021 года № 4/27-VII «О предоставлении в 2021 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Толебийского района»
  kaz: Төлеби аудандық мәслихатының 2021 жылғы 05 мамырдағы № 4/27-VІI «Төлеби ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2021 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешімінің күшін жою туралы
