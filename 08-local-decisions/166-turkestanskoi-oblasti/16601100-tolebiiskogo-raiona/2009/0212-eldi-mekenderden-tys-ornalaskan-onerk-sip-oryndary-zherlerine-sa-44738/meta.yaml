requisite: Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2009 жылғы 12 ақпандағы N 12/94-IV шешімі. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2009 жылғы 12 наурызда N 14-13-53 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2012 жылғы 28 қыркүйектегі № 9/47-V Шешімімен
