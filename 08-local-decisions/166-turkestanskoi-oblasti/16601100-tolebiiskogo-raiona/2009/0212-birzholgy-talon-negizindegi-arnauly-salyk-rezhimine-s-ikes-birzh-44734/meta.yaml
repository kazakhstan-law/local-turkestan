act_code: '44734'
requisite: Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2009 жылғы 12 ақпандағы N 12/90-IV шешімі. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2009 жылғы 12 наурызда N 14-13-49 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2012 жылғы 21 желтоқсандағы № 12/65-V Шешімімен
