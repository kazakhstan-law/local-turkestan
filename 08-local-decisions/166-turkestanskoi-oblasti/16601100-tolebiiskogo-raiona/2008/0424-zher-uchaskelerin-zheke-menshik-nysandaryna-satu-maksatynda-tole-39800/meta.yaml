act_code: '39800'
requisite: Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2008 жылғы 24 сәуірдегі N 6/46-IV шешімі. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2008 жылғы 23 мамырда N 14-13-42 тіркелді
