act_code: '37049'
requisite: Оңтүстік Қазақстан облысы Ордабасы аудандық мәслихатының 2007 жылғы 24 желтоқсандағы N 5/5 шешімі. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2008 жылғы 21 қаңтарда N 14-8-47 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы аудандық мәслихатының 2009 жылғы 18 ақпандағы N 15/6 Шешімімен
title:
