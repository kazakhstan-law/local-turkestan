requisite: Решение Ордабасинского районного маслихата Туркестанской области от 28 января 2020 года № 56/2. Зарегистрировано Департаментом юстиции Туркестанской области 7 февраля 2020 года № 5407
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района
  kaz: Ордабасы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
