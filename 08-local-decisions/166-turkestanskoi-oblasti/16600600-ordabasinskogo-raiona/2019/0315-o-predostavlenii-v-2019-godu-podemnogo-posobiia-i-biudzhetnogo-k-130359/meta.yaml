act_code: '130359'
requisite: Решение Ордабасинского районного маслихата Туркестанской области от 15 марта 2019 года № 41/13. Зарегистрировано Департаментом юстиции Туркестанской области 4 апреля 2019 года № 4960
title:
  rus: «О предоставлении в 2019 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района»
  kaz: «Ордабасы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы»
