requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 30 июня 2015 года № 43/9. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 21 июля 2015 года № 3254. Утратило силу решением Ордабасинского районного маслихата Туркестанской области от 3 октября 2023 года № 7/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества в Ордабасинского района
  kaz: Ордабасы ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын бекіту туралы
