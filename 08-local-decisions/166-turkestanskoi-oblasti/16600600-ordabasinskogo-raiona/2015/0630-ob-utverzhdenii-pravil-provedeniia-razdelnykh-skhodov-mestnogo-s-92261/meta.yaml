  requisite: Решение Ордабасинского районного маслихата Туркестанской области от 28 июня 2022 года № 25/11. Утратило силу решением Ордабасинского районного маслихата Туркестанской области от 27 сентября 2023 года № 6/9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Ордабасинского районного маслихата от 30 июля 2015 года № 43/9 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Ордабасинского района»
    kaz: Ордабасы аудандық мәслихатының 2015 жылғы 30 маусымдағы № 43/9 «Ордабасы ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
