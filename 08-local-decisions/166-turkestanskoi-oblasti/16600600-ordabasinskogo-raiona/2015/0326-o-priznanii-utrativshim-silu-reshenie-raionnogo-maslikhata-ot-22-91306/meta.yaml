title:
  rus: 'О признании утратившим силу решение районного маслихата от 22 апреля 2014 года №31/2 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Ордабасинском районе» '
  kaz: Ордабасы аудандық мәслихатының 2014 жылы 22 сәуірдегі «Ордабасы ауданында бөлек жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындарына өкілдерінің санын айқындау тәртібін бекіту туралы» 31/2 шешімінің күшін жою туралы
