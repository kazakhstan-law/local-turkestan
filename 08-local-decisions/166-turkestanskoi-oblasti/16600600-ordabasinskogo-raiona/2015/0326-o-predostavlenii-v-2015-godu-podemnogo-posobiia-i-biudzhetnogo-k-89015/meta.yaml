act_code: '89015'
requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 26 марта 2015 года № 42/12. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 апреля 2015 № 3124. Утратило силу в связи с истечением срока применения - (письмо Ордабасинского районного маслихата Южно-Казахстанской области от 5 февраля 2016 года № 17)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района
  kaz: Ордабасы ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттiк кредит беру туралы
