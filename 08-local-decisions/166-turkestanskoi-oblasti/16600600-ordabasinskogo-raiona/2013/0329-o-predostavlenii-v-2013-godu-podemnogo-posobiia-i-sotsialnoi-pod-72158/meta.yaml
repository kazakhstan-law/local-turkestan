act_code: '72158'
requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 29 марта 2013 года № 13/14. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 апреля 2013 года № 2273
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района
  kaz: Ордабасы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн әлеуметтiк қолдауды ұсыну туралы
