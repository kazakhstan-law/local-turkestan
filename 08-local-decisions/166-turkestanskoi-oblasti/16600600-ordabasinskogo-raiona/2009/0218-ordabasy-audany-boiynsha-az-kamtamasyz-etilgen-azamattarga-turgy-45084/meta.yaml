act_code: '45084'
requisite: Оңтүстік Қазақстан облысы Ордабасы аудандық мәслихатының 2009 жылғы 18 ақпандағы N 15/6 шешімі. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2009 жылғы 26 наурызда N 14-8-64 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы аудандық мәслихатының 2010 жылғы 30 наурыздағы N 29/13 Шешімімен
