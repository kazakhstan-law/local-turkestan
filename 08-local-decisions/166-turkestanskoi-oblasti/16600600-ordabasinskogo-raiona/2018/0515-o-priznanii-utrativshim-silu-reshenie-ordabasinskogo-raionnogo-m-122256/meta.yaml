requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 15 мая 2018 года № 28/4. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 мая 2018 года № 4615
title:
  rus: О признании утратившим силу решение Ордабасинского районного маслихата от 20 июля 2016 года № 5/2 «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения на территории Ордабасинского района»
  kaz: Ордабасы аудандық мәслихатының 2016 жылғы 20 шілдедегі № 5/2 «Ордабасы ауданының аумағында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерге жер салығының базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күшін жою туралы
