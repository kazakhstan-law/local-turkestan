  title:
    rus: О внесении изменений в решение Ордабасинского районного маслихата от 31 марта 2014 года № 30/16 "О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохренения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Ордабасинского района"
    kaz: Ордабасы аудандық мәслихатының 2014 жылғы 31 наурыздағы № 30/16 "Ордабасы ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
