act_code: '78695'
requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 31 марта 2014 года № 30/12. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 8 апреля 2014 года № 2598. Утратило силу решением Ордабасинского районного маслихата Южно-Казахстанской области от 24 декабря 2014 года № 39/14
title:
  rus: О предоставлении в 2014 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района
  kaz: Ордабасы ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
