  code: '147257'
  requisite: Решение Ордабасинского районного маслихата Туркестанской области от 29 сентября 2020 года № 68/7. Зарегистрировано Департаментом юстиции Туркестанской области 8 октября 2020 года № 5830. Утратило силу решением Ордабасинского районного маслихата Туркестанской области от 19 февраля 2024 года № 12/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Ордабасинского районного маслихата от 24 ноября 2017 года № 19/2 «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Ордабасинскому району»
    kaz: Ордабасы аудандық мәслихатының 2017 жылғы 24 қарашадағы № 19/2 «Ордабасы ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
