act_code: '116911'
requisite: Решение Ордабасинского районного маслихата Южно-Казахстанской области от 24 ноября 2017 года № 19/2. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 декабря 2017 года № 4320. Утратило силу решением Ордабасинского районного маслихата Туркестанской области от 19 февраля 2024 года № 12/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Ордабасинскому району
  kaz: Ордабасы ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
