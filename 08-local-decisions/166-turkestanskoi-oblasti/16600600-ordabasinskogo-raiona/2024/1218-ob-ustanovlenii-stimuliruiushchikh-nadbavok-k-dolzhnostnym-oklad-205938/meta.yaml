act_code: '205938'
requisite: Решение Ордабасинского районного маслихата Туркестанской области от 18 декабря 2024 года № 23/2
title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Молодежный ресурсный центр» отдела внутренней политики Ордабасинского района в размере не более 25 процентов из местного бюджета.
  kaz: Ордабасы аудандық ішкі саясат бөліміне қарасты «Жастар ресурстық орталығы» коммуналдық мемлекеттік мекемесінің қызметкерлерінің лауазымдық айлықақыларына жергілікті бюджеттен ынталандыру үстемақысын 25 пайыздан аспайтын көлемде белгілеу туралы.
