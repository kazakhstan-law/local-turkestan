act_code: '194868'
requisite: Решение Ордабасинского районного маслихата Туркестанской области от 26 марта 2024 года № 13/6
title:
  rus: О предоставлении в 2024 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Ордабасинского района
  kaz: Ордабасы ауданының «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері апппаратының мемлекеттік қызметшілеріне» 2024 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
