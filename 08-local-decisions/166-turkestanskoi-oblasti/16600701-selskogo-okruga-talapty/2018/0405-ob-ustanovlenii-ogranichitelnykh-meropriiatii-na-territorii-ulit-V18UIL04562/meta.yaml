    kaz: Шектеу іс-шараларын алып тастау және Отырар ауданы Отырар ауыл округі әкімінің 2018 жылғы 5 сәуірдегі № 25 «Отырар ауылдық округіне қарасты Арыс елді мекені Т.Танкеев көшесінің аумағына шектеу іс-шараларын белгілеу туралы» шешімінің күші жойылды деп тану туралы
