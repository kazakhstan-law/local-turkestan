title:
  rus: Об утверждении Положения по организации открытых тендеров (конкурса) по предоставлению права на промысловый лов рыбы, закреплению водоемов (участков) и распределению объемов (лимитов) вылова рыбы между природопользователями
  kaz: Табиғат пайдаланушылар арасында кәсіптік балық аулау құқығын беру, су айдындарын (учаскелерін) бекіту және балық аулау мөлшерін (лимитін) үлестіру жөнінде ашық бәсеке (тендер) ұйымдастыру Ережесін бекіту туралы
