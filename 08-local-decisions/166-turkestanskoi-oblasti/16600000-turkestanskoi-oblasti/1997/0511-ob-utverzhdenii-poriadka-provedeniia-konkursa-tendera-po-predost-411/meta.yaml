requisite: Решение акима Южно-Казахстанской области от 12 мая 1997 года № 114. Зарегистрировано Управлением юстиции Южно-Казахстанской области 10 ноября 1997 года № 20. Утратило силу решением акима Южно-Казахстанской области от 28 ноября 2001 года № 225
title:
  rus: Об утверждении порядка проведения конкурса (тендера) по предоставлению права на промысловый лов рыбы и других водных животных, объемов их вылова, а также закреплению промысловых участков на водоемах области
  kaz: Кәсiптiк балық және басқа су жануарларын аулау құқығын беру, оларды аулау мөлшерiн, сондай-ақ облыс су айдындарындағы кәсiптiк балық аулау учаскелерiн бекiту жөнiндегi бәсеке /тендер/ өткiзу тәртiбiн бекiту туралы
