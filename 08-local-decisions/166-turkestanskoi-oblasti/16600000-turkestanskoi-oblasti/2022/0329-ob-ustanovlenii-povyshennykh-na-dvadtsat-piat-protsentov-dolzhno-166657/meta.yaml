act_code: '166657'
requisite: Решение Туркестанского областного маслихата от 29 марта 2022 года № 14/169-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 апреля 2022 года № 27617
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности в государственных организациях, финансируемых из областного бюджета, по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде облыстық бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын мамандардың айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
