  title:
    rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселках, городах районного и областного значения Туркестанской области, а также порядок и размер оказания им социальной поддержки за счет бюджетных средств
    kaz: Түркістан облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы
