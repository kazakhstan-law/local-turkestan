  title:
    rus: О внесении изменений в решение областного маслихата Южно-Казахстанской области от 27 июня 2001 года № 11/127-ІІ «Об установлении границ оценочных зон и поправочных коэффициентов, применяемых к базовым ставкам платы за земельные участки в городах областного значения Южно-Казахстанской области»
    kaz: Оңтүстік Қазақстан облыстық мәслихатының 2001 жылғы 27 маусымдағы № 11/127-ІІ «Оңтүстік Қазақстан облысының облыстық маңызы бар қалаларында бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкасына қолданылатын түзету коэффициенттерін белгілеу туралы» шешіміне өзгерістер енгізу туралы
