    kaz: '"Оңтүстік Қазақстан облысының облыстық маңызы бар қалаларында аймақтардың шекаралары мен жер телімдері үшін ақы төлеудің базалық ставкасына қолданылатын түзету коэффициенттерін белгілеу туралы" Оңтүстік Қазақстан облыстық мәслихатының 27 маусымдағы 2001 жылғы N 11/127-II шешіміне өзгерістер енгізу туралы'
