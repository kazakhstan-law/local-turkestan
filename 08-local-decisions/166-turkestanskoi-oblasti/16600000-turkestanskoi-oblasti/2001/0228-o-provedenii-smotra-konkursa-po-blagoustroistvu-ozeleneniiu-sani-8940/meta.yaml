requisite: Решение акима Южно-Казахстанской области от 28 февраля 2001 года № 91. Зарегистрировано Управлением юстиции Южно-Казахстанской области 18 мая 2001 года № 292
title:
  rus: О проведении смотра-конкурса по благоустройству, озеленению, санитарной очистке территории, улучшения водоснабжения и ремонта дорог и улиц городов, районных центров и других населенных пунктов области
  kaz: Облыстың қалалары мен аудан орталықтарын және басқа да елдi мекендерiн көрiктендiру, көгалдандыру, аумақты санитарлық тазалау, ондағы жолдар мен қала көшелерiн жөндеу, тұрғындарды сумен қамтамасыз етудi жақсарту жөнiнде конкурс-байқау өткiзу туралы
