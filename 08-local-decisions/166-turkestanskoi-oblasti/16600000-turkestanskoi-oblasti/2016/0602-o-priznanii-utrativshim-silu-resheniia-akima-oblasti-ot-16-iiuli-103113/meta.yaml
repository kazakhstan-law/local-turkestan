act_code: '103113'
requisite: Решение акима Южно-Казахстанской области от 2 июня 2016 года № 13
title:
  rus: О признании утратившим силу решения акима области от 16 июля 2015 года № 36 «Об определении объема субсидий на субсидирование стоимости услуг по подаче воды  сельскохозяйственным товаропроизводителям по районам»
  kaz: «Аудандар бойынша ауыл шаруашылығы тауарын өндірушілерге су беру жөніндегі қызметтердің құнын субсидиялауға арналған субсидиялар көлемін айқындау туралы» Оңтүстік Қазақстан облысы әкімінің 2015 жылғы 16 шілдедегі №36 шешімінің күшін жою туралы
