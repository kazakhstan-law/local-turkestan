  title:
    rus: О признании утратившим силу решение Южно-Казахстанского областного маслихата  от 25 февраля 2016 года №47/389-V «Об установлении размеров возмещения расходов на коммунальные услуги и топливо за счет бюджетных средств медицинским и фармацевтическим работникам организаций государственного сектора здравоохранения, работающим в сельской местности и поселках городского типа»
    kaz: Оңтүстік Қазақстан облыстық мәслихатының 2016 жылғы 25 ақпандағы № 47/389-V «Мемлекеттік денсаулық сақтау секторы ұйымдарының ауылдық жерде және қала үлгісіндегі кенттерде жұмыс істейтін медицина және фармацевтика қызметкерлеріне коммуналдық қызметтерге және отынға арналған шығыстарды бюджет қаражаты есебінен өтеу мөлшерін белгілеу туралы» шешімінің үїші жойылды деп тану туралы
