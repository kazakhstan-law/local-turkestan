act_code: '100096'
requisite: Решение областного маслихата Южно-Казахстанской области от 25 февраля 2016 года № 47/389-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 марта 2016 года № 3621. Утратило силу решением Туркестанского областного маслихата от 12 декабря 2018 года № 33/359-VI
title:
  rus: Об установлении размеров возмещения расходов на коммунальные услуги и топливо за счет бюджетных средств медицинским и фармацевтическим работникам организаций государственного сектора здравоохранения,  работающим в сельской местности и поселках городского типа
  kaz: Мемлекеттік денсаулық сақтау секторы ұйымдарының ауылдық жерде және қала үлгісіндегі кенттерде жұмыс істейтін медицина және фармацевтика қызметкерлеріне коммуналдық қызметтерге және отынға арналған шығыстарды бюджет қаражаты есебінен өтеу мөлшерін белгілеу туралы
