title:
  rus: Об утверждении Условий по передаче в имущественный наем (аренду) имущества находящегося в хозяйственном ведении или оперативном управлении государственных коммунальных предприятий, в том числе объектов государственной собственности, не подлежащих приватизации
  kaz: Коммуналдық кәсіпорындардың шаруашылық жүргізуіндегі немесе жедел басқаруындағы мүлікті, оның ішінде жекешелендіруге жатпайтын мемлекеттік меншік объектілерін мүліктік жалға (жалдауға) беру шарттарын бекіту туралы
