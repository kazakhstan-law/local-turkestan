  title:
    rus: О внесении дополнений в решение Южно-Казахстанского областного маслихата от 11 апреля 2008 года № 6/86-ІV «О дополнительном предоставлении лекарственных средств отдельным категориям граждан при амбулаторном лечении бесплатно»
    kaz: «Азаматтардың жекелеген санаттарына амбулаториялық емдеу кезінде тегін дәрілік заттарды қосымша беру туралы» Оңтүстік Қазақстан облыстық мәслихатының 2008 жылғы 11 сәуірдегі № 6/86-ІV шешіміне толықтырулар енгізу туралы
