act_code: '29859'
requisite: Решение Южно-Казахстанского областного маслихата от 29 сентября 2006 года за N 25/286-III. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 9 октября 2006 года за N 1941
title:
  rus: Об утверждении предельных норм сбора физическими лицами для собственных нужд дикорастущих плодов, орехов, грибов, ягод, лекарственного сырья и иных лесных ресурсов на территории государственного лесного фонда Южно-Казахстанской области
  kaz: Оңтүстік Қазақстан облысының мемлекеттік орман қоры аумағында жеке тұлғалардың өз қажеті үшін жабайы өскен жемістерді, жаңғақты, саңырауқұлақтарды, жидектерді, дәрілік шикізаттарды және өзге де орман ресурстарын жинау нормаларының шегін бекіту туралы
