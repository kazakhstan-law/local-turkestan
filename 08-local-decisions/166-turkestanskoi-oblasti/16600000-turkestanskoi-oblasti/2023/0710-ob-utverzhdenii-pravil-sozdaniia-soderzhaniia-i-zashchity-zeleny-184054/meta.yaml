  title:
    rus: О внесении изменения в решение Туркестанского областного маслихата от 10 июля 2023 года № 4/50-VIII «Об утверждении Правил создания, содержания и защиты зеленых насаждений населенных пунктов Туркестанской области, Правил благоустройства территорий городов и населенных пунктов Туркестанской области»
    kaz: Түркістан облыстық мәслихатының «Түркістан облысы елді мекендердің жасыл екпелерін жасау, күтіп-баптау және қорғаудың қағидаларын, Түркістан облысының қалалары мен елді мекендерінің аумақтарын абаттандырудың қағидаларын бекіту туралы» 2023 жылғы 10 шілдедегі № 4/50-VIII шешіміне өзгеріс енгізу туралы
