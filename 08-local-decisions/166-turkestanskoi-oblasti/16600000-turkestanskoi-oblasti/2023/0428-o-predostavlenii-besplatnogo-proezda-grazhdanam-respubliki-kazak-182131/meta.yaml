act_code: '182131'
requisite: Решение Туркестанского областного маслихата от 28 апреля 2023 года № 2/27-VIII. Зарегистрировано Департаментом юстиции Туркестанской области 25 мая 2023 года № 6298-13
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан проживающие в Туркестанской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования на лечение за счет бюджетных средств
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Түркістан облысында тұратын Қазақстан Республикасының азаматтарына бюджет қаражаты есебiнен емделуге тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
