  title:
    rus: О внесении изменения в решение Туркестанского областного маслихата от 10 декабря 2021 года № 13/129-VIІ «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Туркестанской области»
    kaz: «Түркістан облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» Түркістан облыстық мәслихатының 2021 жылғы 10 желтоқсандағы № 13/129-VIІ шешіміне өзгеріс енгізу туралы
