    kaz: Түркістан облыстық мәслихатының «Түркістан облысының елді мекендерінде иттер мен мысықтарды асырау және серуендету Қағидаларын бекіту туралы» 2020 жылғы 30 қазандағы № 53/548-VII және «Түркістан облысының елді мекендерінде қаңғыбас иттер мен мысықтарды аулау және жою Қағидаларын бекіту туралы» 2021 жылғы 4 ақпандағы № 2/13-VII  шешімдерінің күші жойылды деп тану туралы
