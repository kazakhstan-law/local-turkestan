  title:
    rus: О внесении изменений в решение Созакского районного маслихата от 2 июня 2022 года № 108 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры являющимся гражданскими служащими и работающим в сельской местности, финансируемых из районного бюджета»
    kaz: Созақ аудандық мәслихатының 2022 жылғы 2 маусымдағы № 108 «Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
