requisite: Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2009 жылғы 23 қаңтардағы N 100 шешімі. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2009 жылғы 17 ақпанда N 14-12-67 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2010 жылғы 19 наурыздағы N 173 шешімімен
