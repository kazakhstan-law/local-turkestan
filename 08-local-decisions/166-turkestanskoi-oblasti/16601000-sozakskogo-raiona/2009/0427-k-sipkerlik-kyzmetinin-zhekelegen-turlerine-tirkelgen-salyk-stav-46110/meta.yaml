requisite: Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2009 жылғы 27 сәуірдегі N 129 шешімі. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2009 жылғы 21 мамырда N 14-12-74 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2014 жылғы 24 желтоқсандағы № 233 шешімімен
