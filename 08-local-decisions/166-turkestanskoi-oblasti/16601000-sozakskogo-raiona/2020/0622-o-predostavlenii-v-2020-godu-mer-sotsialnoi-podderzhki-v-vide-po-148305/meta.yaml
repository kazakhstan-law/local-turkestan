act_code: '148305'
requisite: Решение Созакского районного маслихата Туркестанской области от 22 июня 2020 года № 340. Зарегистрировано Департаментом юстиции Туркестанской области 13 июля 2020 года № 5707
title:
  rus: О предоставлении в 2020 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
