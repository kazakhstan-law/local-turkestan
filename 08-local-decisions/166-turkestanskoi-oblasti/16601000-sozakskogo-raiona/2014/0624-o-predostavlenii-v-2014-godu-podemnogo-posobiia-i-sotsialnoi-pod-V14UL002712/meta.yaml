requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 24 июня 2014 года № 189. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 июля 2014 года № 2712
title:
  rus: О предоставлении в 2014 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2014 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
