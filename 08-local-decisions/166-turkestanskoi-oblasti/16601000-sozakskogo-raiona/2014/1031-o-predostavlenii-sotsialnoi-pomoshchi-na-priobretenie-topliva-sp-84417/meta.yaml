act_code: '84417'
requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 31 октября 2014 года № 216. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 ноября 2014 года № 2886. Утратило силу решением Созакского районного маслихата Туркестанской области от 26 сентября 2018 года № 191
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Созакского района
  kaz: Созақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
