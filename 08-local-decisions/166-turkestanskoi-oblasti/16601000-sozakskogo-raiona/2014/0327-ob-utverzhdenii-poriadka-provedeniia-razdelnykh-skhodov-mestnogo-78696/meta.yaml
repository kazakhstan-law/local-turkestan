  title:
    rus: О внесении изменений в решение Созакского районного маслихата от 27 марта 2014 года № 163 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Созакском районе»
    kaz: Созақ аудандық мәслихатының 2014 жылғы 27 наурыздағы № 163 «Созақ ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
