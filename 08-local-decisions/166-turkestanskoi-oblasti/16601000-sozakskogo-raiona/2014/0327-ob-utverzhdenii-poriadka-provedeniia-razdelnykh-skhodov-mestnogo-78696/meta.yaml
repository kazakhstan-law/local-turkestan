requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 27 марта 2014 года № 163. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 11 апреля 2014 года № 2602. Утратило силу решением  Созакского районного маслихата Туркестанской области от 22 сентября 2023 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Созакском районе
  kaz: Созақ ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
