  requisite: Решение Созакского районного маслихата Туркестанской области от 12 ноября 2024 года № 142
  title:
    rus: О внесении изменений в решение Созакского районного маслихата от 28 февраля 2024 года № 96 «О предоставлении в 2024 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Созакского района»
    kaz: Созақ аудандық мәслихатының 2024 жылғы 28 ақпандағы № 96 «Созақ ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202667/rus
