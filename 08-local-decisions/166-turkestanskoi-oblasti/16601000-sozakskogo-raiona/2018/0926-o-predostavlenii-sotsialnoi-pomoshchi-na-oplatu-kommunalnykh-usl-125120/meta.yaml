act_code: '125120'
requisite: Решение Созакского районного маслихата Туркестанской области от 26 сентября 2018 года № 191. Зарегистрировано Департаментом юстиции Туркестанской области 5 октября 2018 года № 4755. Утратило силу решением Созакского районного маслихата Туркестанской области от 18 марта 2020 года № 321 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Созакского района
  kaz: Созақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға әлеуметтік көмек беру туралы
