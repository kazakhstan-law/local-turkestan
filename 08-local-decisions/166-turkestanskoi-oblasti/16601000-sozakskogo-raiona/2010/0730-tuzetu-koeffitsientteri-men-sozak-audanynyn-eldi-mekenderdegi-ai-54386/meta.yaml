act_code: '54386'
requisite: Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2010 жылғы 30 шілдедегі N 201 шешімі. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2010 жылғы 8 қыркүйекте N 14-12-101 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2012 жылғы 21 желтоқсандағы № 68 Шешімімен
