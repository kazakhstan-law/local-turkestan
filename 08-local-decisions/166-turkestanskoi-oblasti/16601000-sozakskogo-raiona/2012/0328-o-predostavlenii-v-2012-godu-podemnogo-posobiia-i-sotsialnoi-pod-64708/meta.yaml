requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 28 марта 2012 года N 14. Зарегистрировано Управлением юстиции Созакского района Южно-Казахстанской области 18 апреля 2012 года N 14-12-138. Утратило силу в связи с истечением срока применения - (письмо Созакского районного маслихата Южно-Казахстанской области от 30 января 2013 года № 29)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
