act_code: '58828'
requisite: Оңтүстік Қазақстан облысы Созақ аудандық мәслихатының 2011 жылғы 29 сәуірдегі N 268 шешімі. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2011 жылғы 17 мамырда N 14-12-121 тіркелді
title:
