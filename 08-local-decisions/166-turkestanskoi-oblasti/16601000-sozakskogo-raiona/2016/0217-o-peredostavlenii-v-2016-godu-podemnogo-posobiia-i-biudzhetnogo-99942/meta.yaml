act_code: '99942'
requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 17 февраля 2016 года № 334. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 марта 2016 года № 3613
title:
  rus: О передоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016   жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
