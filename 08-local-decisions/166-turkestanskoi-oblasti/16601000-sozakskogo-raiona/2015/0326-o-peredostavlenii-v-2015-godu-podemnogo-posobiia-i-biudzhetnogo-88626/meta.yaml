act_code: '88626'
requisite: Решение Созакского районного маслихата Южно-Казахстанской области от 26 марта 2015 года № 255. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 апреля 2015 года № 3119. Утратило силу в связи с истечением срока применения - (письмо Созакского районного маслихата Южно-Казахстанской области от 19 января 2016 года № 13)
title:
  rus: О передоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
