title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Созакском районе Туркестанской области
  kaz: Түркістан облысы Созақ ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
