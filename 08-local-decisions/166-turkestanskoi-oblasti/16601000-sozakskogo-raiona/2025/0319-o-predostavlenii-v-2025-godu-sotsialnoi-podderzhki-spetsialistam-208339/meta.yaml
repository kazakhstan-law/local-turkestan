act_code: '208339'
requisite: Решение Созакского районного маслихата Туркестанской области от 19 марта 2025 года № 173
title:
  rus: О предоставлении в 2025 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Созакского района
  kaz: Созақ ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау көрсету туралы
