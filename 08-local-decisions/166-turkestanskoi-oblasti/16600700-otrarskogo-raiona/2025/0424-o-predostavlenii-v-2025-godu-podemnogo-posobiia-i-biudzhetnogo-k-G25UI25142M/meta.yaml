requisite: Решение Отрарского районного маслихата Туркестанской области от 24 апреля 2025 года № 25/142-VIII
title:
  rus: О предоставлении в 2025 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Отырарского района
  kaz: Отырар ауданының «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне» 2025 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
