act_code: '101527'
requisite: Решение Отрарского районного маслихата Южно-Казахстанской области от 30 марта 2016 года № 2/10-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 апреля 2016 года № 3717
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Отрарского района
  kaz: Отырар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
