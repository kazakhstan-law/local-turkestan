act_code: '222352'
requisite: Решение Отрарского районного маслихата Туркестанской области от 19 февраля 2026 года № 33/191-VIII
title:
  rus: О предоставлении в 2026 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Отырарского района
  kaz: Отырар ауданының «Ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері апппаратының мемлекеттік қызметшілеріне» 2026 жылы көтерме жәрдемақ және тұрғын үй сатып алу немесе салу үшін бюджетті кредит беру туралы
