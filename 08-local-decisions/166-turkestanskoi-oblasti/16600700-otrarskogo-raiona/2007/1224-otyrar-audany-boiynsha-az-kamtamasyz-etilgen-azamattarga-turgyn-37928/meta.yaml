act_code: '37928'
requisite: Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2007 жылғы 24 желтоқсандғы N 5/34-IV шешімі. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2008 жылғы 4 ақпанда N 14-9-50 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2009 жылғы 20 шілдедегі N 21/137-IV Шешімімен
