requisite: Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2007 жылғы 24 желтоқсандғы N 5/33-IV шешімі. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2008 жылғы 4 ақпанда N 14-9-51 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар ауданы мәслихатының 2010 жылғы 28 маусымдағы N 32/199-IV шешімімен
