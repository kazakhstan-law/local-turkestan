requisite: Решение Отрарского районного маслихата Южно-Казахстанской области от 30 марта 2018 года № 25/130-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 апреля 2018 года № 4557
title:
  rus: О признании утратившим силу решение Отрарского районного маслихата от 11 июля 2016 года № 3/16-VІ «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения на территории Отрарского района»
  kaz: Отырар аудандық мәслихатының 2016 жылғы 11 шілдедегі № 3/16-VІ «Отырар ауданының аумағында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерге жер салығының базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күшін жою туралы
