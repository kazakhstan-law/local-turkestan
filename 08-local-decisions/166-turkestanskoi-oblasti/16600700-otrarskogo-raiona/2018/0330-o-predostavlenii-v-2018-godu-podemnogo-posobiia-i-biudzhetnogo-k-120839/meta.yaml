act_code: '120839'
requisite: Решение Отрарского районного маслихата Южно-Казахстанской области от 30 марта 2018 года № 25/125-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 12 апреля 2018 года № 4522
title:
  rus: О предоставлении в 2018 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Отрарского района
  kaz: Отырар ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
