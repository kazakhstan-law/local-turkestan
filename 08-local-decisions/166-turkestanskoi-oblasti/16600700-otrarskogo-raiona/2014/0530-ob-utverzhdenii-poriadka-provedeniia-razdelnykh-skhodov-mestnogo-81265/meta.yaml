requisite: Решение Отрарского районного маслихата Южно-Казахстанской области от 30 мая 2014 года № 26/157-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 июля 2014 года № 2711. Утратило силу решением Отрарского районного маслихата Туркестанской области от 13 октября 2023 года № 6/40-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Отрарском районе
  kaz: Отырар ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
