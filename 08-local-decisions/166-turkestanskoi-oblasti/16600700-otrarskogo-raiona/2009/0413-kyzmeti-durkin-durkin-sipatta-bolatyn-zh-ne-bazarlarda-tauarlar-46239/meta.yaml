act_code: '46239'
requisite: Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2009 жылғы 13 сәуірдегі N 18/117-IV шешімі. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2009 жылғы 1 маусымда N 14-9-85 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2012 жылғы 21 желтоқсандағы № 9/62-V Шешімімен
title:
  rus: Қызметі дүркін-дүркін сипатта болатын және базарларда тауарлар өткізу, жұмыстар орындау, қызметтер көрсету жөніндегі қызметтерді жүзеге асыратын Қазақстан Республикасының азаматтары, оралмандар, дара кәсіпкерлер мен заңды тұлғалар үшін біржолғы талон мөлшері туралы
