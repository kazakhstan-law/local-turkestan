requisite: Решение Отрарского районного маслихата Южно-Казахстанской области от 15 сентября 2017 года № 18/87-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 6 октября 2017 года № 4227. Утратило силу решением Отрарского районного маслихата Туркестанской области от 12 мая 2023 года № 2/16-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Отрарскому району
  kaz: Отырар ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
