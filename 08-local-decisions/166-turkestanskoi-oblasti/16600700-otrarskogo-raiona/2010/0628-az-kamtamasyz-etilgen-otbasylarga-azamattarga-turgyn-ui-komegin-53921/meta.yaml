requisite: Оңтүстік Қазақстан облысы Отырар ауданы мәслихатының 2010 жылғы 28 маусымдағы N 32/198-IV шешімі. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2010 жылғы 10 тамызда N 14-9-116 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар аудандық мәслихатының 2012 жылғы 7 маусымдағы № 4/30-V Шешімімен
