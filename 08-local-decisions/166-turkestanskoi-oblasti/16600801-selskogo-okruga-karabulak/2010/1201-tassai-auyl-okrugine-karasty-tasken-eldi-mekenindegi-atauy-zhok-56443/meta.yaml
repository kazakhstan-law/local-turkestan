act_code: '56443'
requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігі Тассай ауыл округі әкімінің 2010 жылғы 1 желтоқсандағы N 112 шешімі. Оңтүстік Қазақстан облысының Әділет департаментінде 2010 жылғы 30 желтоқсанда N 14-10-157 тіркелді
