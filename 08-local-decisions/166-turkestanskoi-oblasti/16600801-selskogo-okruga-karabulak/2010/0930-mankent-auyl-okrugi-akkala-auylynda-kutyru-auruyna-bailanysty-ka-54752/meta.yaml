act_code: '54752'
requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігі Манкент ауыл округі әкімінің 2010 жылғы 30 қыркүйектегі N 84 шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 4 қазанда N 14-10-149 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігі Манкент ауыл округі әкімінің 2010 жылғы 23 желтоқсандағы N 105 Шешімімен
title:
