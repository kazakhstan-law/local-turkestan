    kaz: Шектеу іс-шараларын алып тастау және Түркістан облысы Сайрам ауданының Қарабұлақ ауылдық округі әкімінің 2020 жылғы 1 шілдедегі № 36 «Қарабұлақ ауылдық округі Қарабұлақ ауылы Ахмаров көшесіне шектеу іс-шараларын белгілеу туралы» шешімінің күші жойылды деп тану туралы
