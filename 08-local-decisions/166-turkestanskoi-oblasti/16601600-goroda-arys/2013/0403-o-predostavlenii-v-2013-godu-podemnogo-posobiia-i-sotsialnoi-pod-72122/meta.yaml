act_code: '72122'
requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 3 апреля 2013 года № 14/81-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 апреля 2013 года № 2272
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн әлеуметтiк қолдауды ұсыну туралы
