act_code: '115363'
requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 21 сентября 2017 года № 15/107-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 октября 2017 года № 4232. Утратило силу решением Арысского городского маслихата Туркестанской области от 5 января 2024 года № 13/79-VІІІ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Арыс
  kaz: Арыс қаласы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған  тарифтерді бекіту туралы
