  title:
    rus: О внесении изменения в решение Арысского городского маслихата от 21 сентября 2017 года № 15/107-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Арыс»
    kaz: Арыс қалалық мәслихатының 2017 жылғы 21 қыркүйектегі № 15/107-VI «Арыс қаласы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
