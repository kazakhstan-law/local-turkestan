requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 24 марта 2017 года № 11/78-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 апреля 2017 года № 4027. Утратило силу решением Арысского городского маслихата Туркестанской области от 19 сентября 2018 года № 26/189-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Арыс
  kaz: Арыс қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
