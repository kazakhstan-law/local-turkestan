requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 29 сентября 2016 года № 6/35-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 октября 2016 года № 3864. Утратило силу решением Арысского городского маслихата Южно-Казахстанской области от 9 февраля 2017 года № 10/66-VI
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Арыс
  kaz: Арыс қаласы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға әкетуге, кәдеге жаратуға қайта өңдеуге және көмуге  арналған тарифтерді бекiту туралы
