act_code: '100840'
requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 4 марта 2016 года № 52/315-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 апреля 2016 года № 3692
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и  агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
