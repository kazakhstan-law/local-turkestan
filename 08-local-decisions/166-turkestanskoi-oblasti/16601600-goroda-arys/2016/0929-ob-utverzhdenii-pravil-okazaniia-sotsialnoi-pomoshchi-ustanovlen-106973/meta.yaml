    kaz: Арыс қалалық мәслихатының 2016 жылғы 29 қыркүйектегі № 6/33-VІ «Арыс қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
