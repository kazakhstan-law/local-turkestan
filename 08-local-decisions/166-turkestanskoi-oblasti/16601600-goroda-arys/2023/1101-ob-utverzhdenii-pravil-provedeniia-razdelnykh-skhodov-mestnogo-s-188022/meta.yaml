act_code: '188022'
requisite: Решение Арысского городского маслихата Туркестанской области от 1 ноября 2023 года № 9/57-VІІІ
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества сельских округов города Арыс Туркестанской области
  kaz: Түркістан облысы Арыс қаласы ауылдық округтерінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
