  title:
    rus: О внесении изменений в решение маслихата города Арыс от 30 июля 2014 года № 31/182-V «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в городе Арыс»
    kaz: Арыс қалалық мәслихатының 2014 жылғы 30 шілдедегі № 31/182-V «Арыс қаласында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
