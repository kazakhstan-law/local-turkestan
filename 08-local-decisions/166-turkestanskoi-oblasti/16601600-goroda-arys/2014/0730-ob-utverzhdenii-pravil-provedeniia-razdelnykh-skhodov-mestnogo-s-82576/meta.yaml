act_code: '82576'
requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 30 июля 2014 года № 31/182-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 августа 2014 года № 2793. Утратило силу решением Арысского городского маслихата Туркестанской области от 28 сентября 2023 года № 8/47-VІІІ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
