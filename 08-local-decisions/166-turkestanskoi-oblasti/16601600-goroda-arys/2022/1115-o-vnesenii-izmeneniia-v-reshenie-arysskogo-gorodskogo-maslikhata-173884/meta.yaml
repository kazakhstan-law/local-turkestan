requisite: Решение Арысского городского маслихата Туркестанской области от 15 ноября 2022 года № 29/155-VІІ. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 ноября 2022 года № 30604. Утратило силу решением Арысского городского маслихата Туркестанской области от 28 сентября 2023 года № 8/51-VІІІ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О внесений изменения в решение Арысского городского маслихата от 31 марта 2021 года № 4/19-VII «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Арыс»
  kaz: Арыс қалалық мәслихатының 2021 жылғы 31 наурыздағы № 4/19-VII «Арыс қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгеріc енгізу туралы
