requisite: Решение Арысского городского маслихата Туркестанской области от 25 августа 2022 года № 27/138-VІІ. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 сентября 2022 года № 29344
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта являющимся гражданскими служащими и работающим в сельской местности города Арыс
  kaz: Арыс қаласының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
