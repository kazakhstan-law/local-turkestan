act_code: '165756'
requisite: Решение Арысского городского маслихата Туркестанской области от 18 марта 2022 года № 21/108-VІІ
title:
  rus: О предоставлении в 2022 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы әлеуметтік қолдауды ұсыну туралы
