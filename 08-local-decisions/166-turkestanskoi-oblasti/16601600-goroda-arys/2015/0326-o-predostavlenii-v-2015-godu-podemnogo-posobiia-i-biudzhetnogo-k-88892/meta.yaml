requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 26 марта 2015 года № 39/235-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 20 апреля 2015 года № 3145. Утратило силу в связи с истечением срока применения - (письмо Арысского городского маслихата Южно-Казахстанской области от 5 января 2016 года № 2)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
