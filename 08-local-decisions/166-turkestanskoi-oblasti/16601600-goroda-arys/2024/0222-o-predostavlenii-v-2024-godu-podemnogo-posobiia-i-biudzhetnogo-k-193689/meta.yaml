act_code: '193689'
requisite: Решение Арысского городского маслихата Туркестанской области от 22 февраля 2024 года № 15/84-VІІІ. Утратило силу решением Арысского городского маслихата Туркестанской области от 1 октября 2024 года № 22/137-VІІІ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «О предоставлении в 2024 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Арыс»
  kaz: «Арыс қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы»
