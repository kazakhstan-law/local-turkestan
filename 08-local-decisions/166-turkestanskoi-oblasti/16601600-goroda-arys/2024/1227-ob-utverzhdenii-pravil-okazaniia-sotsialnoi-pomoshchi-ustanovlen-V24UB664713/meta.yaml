  title:
    rus: О внесении изменений и дополнений в решение маслихата города Арыс от 27 декабря 2024 года № 28/160-VIII «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
