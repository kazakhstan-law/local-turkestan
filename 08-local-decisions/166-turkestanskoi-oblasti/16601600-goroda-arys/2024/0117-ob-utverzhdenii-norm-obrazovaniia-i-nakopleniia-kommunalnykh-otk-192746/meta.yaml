act_code: '192746'
requisite: Решение Арысского городского маслихата Туркестанской области от 17 января 2024 года № 14/81-VІІІ
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по городу Арыс
  kaz: «Арыс қаласы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы»
