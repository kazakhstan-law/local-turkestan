  title:
    rus: О внесении изменений в решение Арысского городского маслихата от 13 марта 2020 года № 47/325-VI «О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Арыс»
    kaz: Арыс қалалық мәслихатының 2020 жылғы 13 наурыздағы № 47/325-VI «Арыс қаласының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгерістер енгізу туралы
