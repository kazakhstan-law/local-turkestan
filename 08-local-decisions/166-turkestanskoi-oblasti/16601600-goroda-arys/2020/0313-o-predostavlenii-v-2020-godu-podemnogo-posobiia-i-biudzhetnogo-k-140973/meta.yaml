act_code: '140973'
requisite: Решение Арысского городского маслихата Туркестанской области от 13 марта 2020 года № 47/325-VI. Зарегистрировано Департаментом юстиции Туркестанской области 1 апреля 2020 года № 5539
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
