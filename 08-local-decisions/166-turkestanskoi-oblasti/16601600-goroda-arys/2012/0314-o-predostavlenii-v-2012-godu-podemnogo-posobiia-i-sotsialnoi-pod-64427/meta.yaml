act_code: '64427'
requisite: Решение Арысского городского маслихата Южно-Казахстанской области от 14 марта 2012 года № 2/14-V. Зарегистрировано Управлением юстиции города Арыс Южно-Казахстанской области 6 апреля 2012 года № 14-2-128. Утратило силу в связи с истечением срока применения - (письмо аппарата маслихата города Арыс Южно-Казахстанской области от 28 марта 2013 года № 48)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты города Арыс
  kaz: Арыс қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
