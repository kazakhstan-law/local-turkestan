  title:
    rus: О внесении изменений и дополнений в решение Арысского городского маслихата от 23 января 2009 года № 16/101-IV "Об установлении стоимости разовых  талонов для физических лиц, деятельность которых носит эпизодический характер и физических лиц, осуществляющих деятельность по реализации  товаров, выполнению работ, оказанию услуг на рынках"
    kaz: Арыс қалалық мәслихатының 2009 жылғы 23 қаңтардағы № 16/101-IV "Қызметі дүркін-дүркін сипатта болатын және базарларда тауарлар өткізу, жұмыстар орындау, қызметтер көрсету жөніндегі қызметтерді жүзеге асыратын жеке тұлғалар үшін біржолғы талон құнының мөлшері туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
