requisite: Оңтүстік Қазақстан облысы Арыс қалалық мәслихатының 2009 жылғы 23 қаңтардағы N 16/103-IV шешімі. Оңтүстік Қазақстан облысы Арыс қаласының Әділет басқармасында 2009 жылғы 20 ақпанда N 14-2-67 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Арыс қалалық мәслихатының 2009 жылғы 3 шілдедегі N 21/134-IV Шешімімен
