requisite: Оңтүстік Қазақстан облысы Арыс қалалық мәслихатының 2011 жылғы 30 маусымдағы N 45/282-IV шешімі. Оңтүстік Қазақстан облысы Арыс қаласының Әділет басқармасында 2011 жылғы 13 шілдеде N 14-2-110 тіркелді
title:
  rus: Арыс қаласына қарасты ауылдық елді мекендеріне 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
