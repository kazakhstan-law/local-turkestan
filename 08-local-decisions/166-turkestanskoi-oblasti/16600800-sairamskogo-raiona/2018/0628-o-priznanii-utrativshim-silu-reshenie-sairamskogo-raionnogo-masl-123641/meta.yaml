title:
  rus: О признании утратившим силу решение Сайрамского районного маслихата от 19 июля 2016 года № 6-35/VІ «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения»
  kaz: Сайрам аудандық мәслихатының 2016 жылғы 19 шілдедегі № 6-35/VІ «Пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күшін жою туралы
