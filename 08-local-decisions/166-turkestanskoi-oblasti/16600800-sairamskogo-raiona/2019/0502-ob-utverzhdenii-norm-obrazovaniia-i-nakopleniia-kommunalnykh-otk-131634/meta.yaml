act_code: '131634'
requisite: Решение Сайрамского районного маслихата Туркестанской области от 2 мая 2019 года № 40-257/VI. Зарегистрировано Департаментом юстиции Туркестанской области 14 мая 2019 года № 5050. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 16 мая 2023 года № 2-18/VIII (вводится в действие по истечении десяти календарных  дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Сайрамскому району
  kaz: Сайрам ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
