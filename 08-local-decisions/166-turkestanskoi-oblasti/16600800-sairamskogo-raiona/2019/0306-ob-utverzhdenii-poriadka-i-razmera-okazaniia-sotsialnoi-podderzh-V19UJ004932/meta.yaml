requisite: Решение Сайрамского районного маслихата Туркестанской области от 6 марта 2019 года № 38-244/VI. Зарегистрировано Департаментом юстиции Туркестанской области 15 марта 2019 года № 4932. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 29 ноября 2019 года № 45-282/VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сайрамского района
  kaz: Сайрам ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
