act_code: '39037'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2007 жылғы 31 қазандағы N 2-25/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2007 жылғы 28 қарашада N 14-10-70 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2010 жылғы 18 наурыздағы N 29-273/IV шешімімен
