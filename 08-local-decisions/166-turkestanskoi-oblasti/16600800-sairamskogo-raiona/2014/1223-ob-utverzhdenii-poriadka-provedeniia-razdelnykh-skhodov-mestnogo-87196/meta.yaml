requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 23 декабря 2014 года № 40-262/V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 4 февраля 2015 года № 3004. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 27 сентября 2023 года № 7-56/VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Сайрамском районе
  kaz: Сайрам ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
