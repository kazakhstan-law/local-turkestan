requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2003 жылғы 30 маусымдағы N XXV-211 шешімі. Оңтүстік Қазақстан облысы Әділет басқармасында 2003 жылғы 23 шілдеде N 931 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2007 жылғы 31 қазандағы N 2-25/IV Шешімімен
