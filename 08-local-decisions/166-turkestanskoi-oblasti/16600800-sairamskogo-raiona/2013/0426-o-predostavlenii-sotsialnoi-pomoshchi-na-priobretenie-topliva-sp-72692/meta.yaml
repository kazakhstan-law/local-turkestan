requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 26 апреля 2013 года № 17-109/V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 мая 2013 года № 2287. Утратило силу решением Сайрамского районного маслихата Южно-Казахстанской области от 23 декабря 2014 года № 40-266/V
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сайрамского района
  kaz: Сайрам ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
