requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 27 марта 2013 года № 16-103/V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 апреля 2013 года № 2276
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Сайрамского района в 2013 году
  kaz: Сайрам ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн әлеуметтiк қолдауды ұсыну туралы
