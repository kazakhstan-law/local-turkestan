  requisite: Решение маслихата Сайрамского района Южно-Казахстанской области от 16 марта 2012 года N 3-33/V. Зарегистрировано Управлением юстиции Сайрамского района Южно-Казахстанской области 13 апреля 2012 года N 14-10-184. Утратило силу решением маслихата Сайрамского района Южно-Казахстанской области от 21 декабря 2012 года № 13-86/V
  title:
    rus: О внесении изменений в решение Сайрамского районного маслихата от 27 января 2009 года № 14-169/ІV "Об установлении стоимости разовых талонов на рынках Сайрамского района и для специального налогового режима, деятельность которых носит эпизодический характер"
    kaz: Сайрам аудандық мәслихатының 2009 жылғы 27 қаңтардағы № 14-169/ІV "Сайрам ауданының базарларында және арнаулы салық режимінің қызметі дүркін-дүркін сипатта болатын бір жолғы талон құнын белгілеу туралы" шешіміне өзгерістер енгізу туралы
