act_code: '49066'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 3 желтоқсандағы N 24-243/IV Шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 3 желтоқсанда N 14-10-127 тіркелді
