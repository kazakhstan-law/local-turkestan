act_code: '48442'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 30 қазандағы N 23-238/IV Шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 5 қарашада N 14-10-125 тіркелді
