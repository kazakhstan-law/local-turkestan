requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 17 шілдедегі N 21-213/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 22 шілдеде N 14-10-119 тіркелді
