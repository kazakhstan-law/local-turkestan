act_code: '45548'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 28 сәуірдегі N 19-200/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 30 сәуірде N 14-10-117 тіркелді
