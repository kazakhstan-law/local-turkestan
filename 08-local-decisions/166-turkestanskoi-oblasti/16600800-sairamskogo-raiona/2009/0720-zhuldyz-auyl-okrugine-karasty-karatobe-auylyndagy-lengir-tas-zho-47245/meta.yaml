act_code: '47245'
requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігі Жұлдыз ауыл округі әкімінің 2009 жылғы 20 шілдедегі N 368 шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 10 тамызда N 14-10-121 тіркелді
