act_code: '59038'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2011 жылғы 26 мамырдағы N 47-386/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2011 жылғы 31 мамырда N 14-10-166 тіркелді
