act_code: '58038'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2011 жылғы 30 наурыздағы N 46-380/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2011 жылғы 6 сәуірде N 14-10-164 тіркелді
