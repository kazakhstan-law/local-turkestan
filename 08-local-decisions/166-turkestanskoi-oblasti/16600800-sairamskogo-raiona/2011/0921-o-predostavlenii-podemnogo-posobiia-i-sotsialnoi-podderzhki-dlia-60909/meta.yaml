requisite: Решение маслихата Сайрамского района Южно-Казахстанской области от 21 сентября 2011 года N 52-419/IV. Зарегистрировано Управлением юстиции Сайрамского района Южно-Казахстанской области 20 октября 2011 года N 14-10-170
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Сайрамского района в 2011 году
  kaz: Сайрам ауданының ауылдық елді мекендеріне 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
