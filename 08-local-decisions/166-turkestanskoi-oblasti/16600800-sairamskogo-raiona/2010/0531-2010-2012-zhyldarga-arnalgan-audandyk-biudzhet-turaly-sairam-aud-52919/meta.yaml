act_code: '52919'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2010 жылғы 31 мамырдағы N 32-292/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 4 маусымда N 14-10-141 тіркелді
