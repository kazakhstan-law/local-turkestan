act_code: '53850'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2010 жылғы 30 маусымдағы N 33-299/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 5 тамызда N 14-10-145 тіркелді
title:
  rus: Ауданның ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
  kaz: Ауданның ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
