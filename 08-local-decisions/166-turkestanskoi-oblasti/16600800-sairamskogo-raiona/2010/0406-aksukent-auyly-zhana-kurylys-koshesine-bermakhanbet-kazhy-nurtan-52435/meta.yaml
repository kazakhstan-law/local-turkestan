act_code: '52435'
requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігі Ақсукент ауылы округі әкімінің 2010 жылғы 6 сәуірдегі N 66 шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 11 мамырда N 14-10-140 тіркелді
