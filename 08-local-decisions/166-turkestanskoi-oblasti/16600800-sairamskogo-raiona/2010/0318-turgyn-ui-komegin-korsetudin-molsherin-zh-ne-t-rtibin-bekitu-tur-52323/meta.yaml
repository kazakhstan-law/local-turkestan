requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2010 жылғы 18 наурыздағы N 29-279/IV шешімі. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 11 мамырда N 14-10-139 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2012 жылғы 29 маусымдағы № 6-47/V Шешімімен
