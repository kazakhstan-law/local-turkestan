act_code: '92309'
requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 17 июня 2015 года № 43-301/V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 июля 2015 года № 3239. Утратило силу в связи с истечением срока применения - (письмо Сайрамского районного маслихата Южно-Казахстанской области от 8 января 2016 года № 3)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сайрамcкого района
  kaz: Сайрам ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
