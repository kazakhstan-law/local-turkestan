act_code: '181557'
requisite: Решение Сайрамского районного маслихата Туркестанской области от 16 мая 2023 года № 2-18/VIII. Зарегистрировано Департаментом юстиции Туркестанской области 17 мая 2023 года № 6277-13. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 5 апреля 2024 года № 15-118/VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Сайрамскому району
  kaz: Сайрам ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы
