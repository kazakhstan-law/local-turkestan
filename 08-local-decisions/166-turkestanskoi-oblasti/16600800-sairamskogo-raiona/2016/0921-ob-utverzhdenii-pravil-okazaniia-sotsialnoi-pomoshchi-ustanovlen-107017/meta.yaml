    kaz: Сайрам аудандық мәслихатының 2016 жылғы 21 қыркүйектегі № 7-44/VI «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
