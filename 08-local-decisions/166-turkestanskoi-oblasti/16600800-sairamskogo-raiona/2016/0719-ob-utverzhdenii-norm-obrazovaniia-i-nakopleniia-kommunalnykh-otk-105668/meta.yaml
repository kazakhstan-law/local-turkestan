requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 19 июля 2016 года № 6-36/VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 августа 2016 года № 3834. Утратило силу решением Сайрамского районного маслихата Южно-Казахстанской области от 16 марта 2017 года № 13-92/VI
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Аксукентскому сельскому округу
  kaz: Ақсукент ауылдық округі бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын және тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
