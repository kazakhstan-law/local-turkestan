requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 3 июня 2016 года № 5-27/VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 июня 2016 года № 3761
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования,  социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сайрамcкого района
  kaz: Сайрам ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшiн бюджеттік кредит беру туралы
