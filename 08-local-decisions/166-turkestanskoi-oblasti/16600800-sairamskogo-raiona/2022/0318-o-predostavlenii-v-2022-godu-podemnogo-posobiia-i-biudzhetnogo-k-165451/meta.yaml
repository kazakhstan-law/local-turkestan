act_code: '165451'
requisite: Решение Сайрамского районного маслихата Туркестанской области от 18 марта 2022 года № 14-93/VII
title:
  rus: О предоставлении в 2022 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельского округа, прибывшим для работы и проживания в сельские населенные пункты Сайрамского района
  kaz: Сайрам ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
