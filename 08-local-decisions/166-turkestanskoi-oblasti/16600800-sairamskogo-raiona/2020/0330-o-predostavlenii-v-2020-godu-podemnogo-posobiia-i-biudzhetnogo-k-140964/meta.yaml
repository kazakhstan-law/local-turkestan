act_code: '140964'
requisite: Решение Сайрамского районного маслихата Туркестанской области от 30 марта 2020 года № 52-316/VI. Зарегистрировано Департаментом юстиции Туркестанской области 1 апреля 2020 года № 5533
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сайрамского района
  kaz: Сайрам ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне  2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
