requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 28 декабря 2017 года № 23-160/VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 января 2018 года № 4411. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 2 мая 2019 года № 40-257/VI
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Аксукентскому сельскому округу
  kaz: Ақсукент ауылдық округі бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерін бекіту туралы
