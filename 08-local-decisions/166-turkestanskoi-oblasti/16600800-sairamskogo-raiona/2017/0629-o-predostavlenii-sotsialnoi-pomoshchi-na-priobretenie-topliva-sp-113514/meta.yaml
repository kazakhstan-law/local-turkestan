act_code: '113514'
requisite: Решение Сайрамского районного маслихата Южно-Казахстанской области от 29 июня 2017 года № 16-113/VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 июля 2017 года № 4152. Утратило силу решением Сайрамского районного маслихата Туркестанской области от 27 декабря 2018 года № 33-219/VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сайрамского района
  kaz: Сайрам ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
