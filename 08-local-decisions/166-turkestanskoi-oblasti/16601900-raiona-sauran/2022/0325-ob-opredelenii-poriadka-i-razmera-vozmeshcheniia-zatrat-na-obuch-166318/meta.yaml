    kaz: Мәслихаттың 2022 жылғы 25 наурыздағы № 107 «Сауран ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өтеу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
