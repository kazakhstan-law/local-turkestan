act_code: '164186'
requisite: Решение Сауранского районного маслихата Туркестанской области от 28 января 2022 года № 88
title:
  rus: «О предоставлении в 2022 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Сауран»
  kaz: «Сауран ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы»
