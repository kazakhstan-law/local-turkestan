  title:
    rus: О внесении изменений в решение маслихата от 25 марта 2022 года № 107 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в районе Сауран»
