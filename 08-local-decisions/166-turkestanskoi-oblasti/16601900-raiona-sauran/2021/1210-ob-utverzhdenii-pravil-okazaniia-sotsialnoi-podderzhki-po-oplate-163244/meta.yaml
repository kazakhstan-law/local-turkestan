act_code: '163244'
requisite: Решение Сауранского районного маслихата Туркестанской области от 10 декабря 2021 года № 67. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2022 года № 26340
title:
  rus: Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сауранского района
  kaz: Сауран ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік  қамсыздандыру,білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын бекіту туралы
