act_code: '80635'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 27 мая 2014 года № 31-253-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 11 июня 2014 года № 2694
title:
  rus: О предоставлении в 2014 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2014 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
