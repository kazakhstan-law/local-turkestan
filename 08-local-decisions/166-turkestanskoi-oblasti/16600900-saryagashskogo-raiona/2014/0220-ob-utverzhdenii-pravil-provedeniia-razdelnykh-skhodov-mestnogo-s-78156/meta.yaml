act_code: '78156'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 20 февраля 2014 года № 28-213-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 марта 2014 года № 2574. Утратило силу решением Сарыагашского районного маслихата Туркестанской области от 22 сентября 2023 года № 7-65-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества в Сарыагашском районе
  kaz: Сарыағаш ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын бекіту туралы
