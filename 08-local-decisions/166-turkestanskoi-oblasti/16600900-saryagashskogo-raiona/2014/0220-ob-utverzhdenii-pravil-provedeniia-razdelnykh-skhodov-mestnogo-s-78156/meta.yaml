  requisite: Решение Сарыагашского районного маслихата Туркестанской области от 11 марта 2022 года № 18-131-VII. Утратило силу решением Сарыагашского районного маслихата Туркестанской области от 22 сентября 2023 года № 7-65-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Сарыагашского районного маслихата от 20 февраля 2014 года № 28-213-V «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Сарыагашском районе»
    kaz: Сарыағаш аудандық мәслихатының 2014 жылғы 20 ақпандағы № 28-213-V «Сарыағаш ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
