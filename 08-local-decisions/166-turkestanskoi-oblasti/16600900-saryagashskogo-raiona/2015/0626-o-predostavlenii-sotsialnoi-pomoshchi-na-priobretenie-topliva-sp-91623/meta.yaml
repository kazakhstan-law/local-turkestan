act_code: '91623'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 26 июня 2015 года № 41-368-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 июля 2015 года № 3240. Утратило силу решением Сарыагашского районного маслихата Туркестанской области от 25 июня 2019 года № 39-375-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах     Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлкеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
