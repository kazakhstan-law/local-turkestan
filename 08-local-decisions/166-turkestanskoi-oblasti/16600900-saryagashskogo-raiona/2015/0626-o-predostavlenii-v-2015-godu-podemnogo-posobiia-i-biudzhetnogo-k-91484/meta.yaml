requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 26 июня 2015 года № 41-371-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 7 июля 2015 года № 3234. Утратило силу в связи с истечением срока применения - (письмо аппарата Сарыагашского районного маслихата Южно-Казахстанской области от 28 декабря 2015 года № 449)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
