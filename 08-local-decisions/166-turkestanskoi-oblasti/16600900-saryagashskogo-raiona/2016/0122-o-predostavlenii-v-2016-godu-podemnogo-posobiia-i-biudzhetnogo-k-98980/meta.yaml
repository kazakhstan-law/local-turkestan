act_code: '98980'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 22 января 2016 года № 48-436-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 8 февраля 2016 года № 3568
title:
  rus: О предоставлении в 2016 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
