requisite: Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2009 жылғы 29 сәуірдегі N 23-6-150 Шешімі. Оңтүстік Қазақстан облысы Сарыағаш ауданының Әділет басқармасында 2009 жылғы 8 маусымда N 14-11-104 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2012 жылғы 27 тамыздағы N 9-62-V Шешімімен
