act_code: '72030'
requisite: Решение маслихата Сарыагашского района Южно-Казахстанской области от 19 марта 2013 года № 15-125-V. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 апреля 2013 года № 2268
title:
  rus: О предоставлении в 2013 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін  келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,  спорт және ветеринария мамандарына 2013 жылы көтерме жәрдемақы және  тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
