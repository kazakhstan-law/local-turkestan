requisite: Решение Сарыагашского районного маслихата Туркестанской области от 6 марта 2020 года № 48-436-VI. Зарегистрировано Департаментом юстиции Туркестанской области 18 марта 2020 года № 5504
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
