  requisite: Решение Сарыагашского районного маслихата Туркестанской области от 3 октября 2025 года № 34-261-VIII. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 октября 2025 года № 37159
  title:
    rus: О внесении изменений к решению Сарыагашского районного маслихата от 16 апреля 2020 года № 50-445-VI «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сарыагашского района»
    kaz: Сарыағаш аудандық мәслихатының 2020 жылғы 16 сәуірдегі № 50-445-VI «Сарыағаш ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215795/rus
