act_code: '142693'
requisite: Решение Сарыагашского районного маслихата Туркестанской области от 16 апреля 2020 года № 50-445-VI. Зарегистрировано Департаментом юстиции Туркестанской области 6 мая 2020 года № 5607
title:
  rus: Об утверждении Правил и размеров оказания социальной поддержки специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населённых пунктах Сарыагашского района, по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств
  kaz: Сарыағаш ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария салаларындағы мемлекеттік ұйымдардың мамандарына коммуналдық қызметтерді төлеу және отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы
