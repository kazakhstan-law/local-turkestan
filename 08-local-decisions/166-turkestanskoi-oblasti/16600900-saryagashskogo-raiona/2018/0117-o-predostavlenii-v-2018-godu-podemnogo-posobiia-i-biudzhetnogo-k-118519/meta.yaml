act_code: '118519'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 17 января 2018 года № 19-206-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 25 января 2018 года № 4421
title:
  rus: О предоставлении в 2018 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
