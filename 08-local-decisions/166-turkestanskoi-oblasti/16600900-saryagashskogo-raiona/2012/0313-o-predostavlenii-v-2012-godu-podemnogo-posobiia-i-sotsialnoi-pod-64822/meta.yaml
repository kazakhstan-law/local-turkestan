act_code: '64822'
requisite: Решение маслихата Сарыагашского района Южно-Казахстанской области от 13 марта 2012 года № 3-23-V. Зарегистрировано Управлением юстиции Сарыагашского района Южно-Казахстанской области 13 апреля 2012 года № 14-11-189. Утратило силу решением Сарыагашского районного маслихата Южно-Казахстанской области от 21 декабря 2012 года № 12-101-V
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдау шараларын ұсыну туралы
