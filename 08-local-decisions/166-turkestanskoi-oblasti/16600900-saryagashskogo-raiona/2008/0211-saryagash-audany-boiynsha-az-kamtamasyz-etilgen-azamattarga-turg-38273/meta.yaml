requisite: Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2008 жылғы 11 ақпандағы N 6-2-29 шешімі. Оңтүстік Қазақстан облысы Сарыағаш ауданының Әділет басқармасында 2008 жылғы 11 наурызда N 14-11-82 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2009 жылғы 30 маусымдағы N 24-13-166 Шешімімен
