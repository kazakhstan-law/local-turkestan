requisite: Решение Сарыагашского районного маслихата Туркестанской области от 25 июня 2019 года № 39-372-VI. Зарегистрировано Департаментом юстиции Туркестанской области 10 июля 2019 года № 5129. Утратило силу решением Сарыагашского районного маслихата Туркестанской области от 23 июня 2023 года № 4-45-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Сарыагашскому району
  kaz: Сарыағаш ауданы бойынша коммуналдық қалдықтардың түзілумен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
