act_code: '133071'
requisite: Решение Сарыагашского районного маслихата Туркестанской области от 25 июня 2019 года № 39-375-VI. Зарегистрировано Департаментом юстиции Туркестанской области 1 июля 2019 года № 5116. Утратило силу решением Сарыагашского районного маслихата Туркестанской области от 16 апреля 2020 года № 50-445-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретение топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алуға әлеуметтік көмек беру туралы
