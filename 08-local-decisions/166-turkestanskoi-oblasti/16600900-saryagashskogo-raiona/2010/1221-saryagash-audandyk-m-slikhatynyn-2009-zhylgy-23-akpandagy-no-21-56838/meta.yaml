requisite: Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2010 жылғы 21 желтоқсандағы N 43-302-IV шешімі. Оңтүстік Қазақстан облысы Сарыағаш ауданының Әділет басқармасында 2011 жылғы 18 қаңтарда N 14-11-164 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихатының 2012 жылғы 08 тамыздағы № 9-63-V шешімімен
