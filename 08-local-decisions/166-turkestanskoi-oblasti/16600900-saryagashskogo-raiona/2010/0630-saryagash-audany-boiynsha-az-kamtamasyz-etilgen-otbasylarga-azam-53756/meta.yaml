act_code: '53756'
requisite: Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2010 жылғы 30 маусымдағы N 38-260-IV Шешімі. Оңтүстік Қазақстан облысы Сарыағаш ауданының Әділет басқармасында 2010 жылғы 30 шілдеде N 14-11-131 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихат сессиясының 2012 жылғы 27 маусымдағы N 7-57-V Шешімімен
