act_code: '110922'
requisite: Решение Сарыагашского районного маслихата Южно-Казахстанской области от 31 марта 2017 года № 10-114-VI. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 31 марта 2017 года № 4006
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарыагашского района
  kaz: Сарыағаш ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
