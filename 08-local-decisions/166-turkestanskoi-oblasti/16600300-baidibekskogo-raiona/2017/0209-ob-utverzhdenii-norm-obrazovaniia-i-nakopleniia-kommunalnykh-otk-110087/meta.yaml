act_code: '110087'
requisite: Решение Байдибекского районного маслихата Южно-Казахстанской области от 9 февраля 2017 года № 12/70. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 24 февраля 2017 года № 3984. Утратило силу решением Байдибекского районного маслихата Туркестанской области от 28 октября 2020 года № 57/341 (вводится в действие по истечении десяти календарных  дней  после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Байдибекскому району
  kaz: Бәйдібек ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
