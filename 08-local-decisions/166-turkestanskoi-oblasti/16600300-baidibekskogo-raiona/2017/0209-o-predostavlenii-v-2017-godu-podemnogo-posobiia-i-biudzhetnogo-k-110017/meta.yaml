act_code: '110017'
requisite: Решение Байдибекского районного маслихата Южно-Казахстанской области от 9 февраля 2017 года № 12/69. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 24 февраля 2017 года № 3983
title:
  rus: О предоставлении в 2017 году подъемного пособия и бюджетного кредита на приобретение или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Байдибекского района
  kaz: Бәйдібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға 2017 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
