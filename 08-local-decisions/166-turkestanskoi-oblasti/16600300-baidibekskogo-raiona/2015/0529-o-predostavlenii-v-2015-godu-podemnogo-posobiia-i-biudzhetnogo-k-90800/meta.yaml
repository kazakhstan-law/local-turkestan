act_code: '90800'
requisite: Решение Байдибекского районного маслихата Южно-Казахстанской области от 29 мая 2015 года № 37/201. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 15 июня 2015 года № 3207. Утратило силу в связи с истечением срока применения - (письмо Байдибекского районного маслихата Южно-Казахстанской области от 26 января 2016 года № 14)
title:
  rus: О предоставлении в 2015 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Байдибекского района
  kaz: Бәйдібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2015 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
