requisite: Оңтүстік Қазақстан облысы Бәйдібек аудандық мәслихатының 2009 жылғы 17 ақпандағы N 16/94 шешімі. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2009 жылғы 12 наурызда N 14-5-73 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек аудандық мәслихатының 2015 жылғы 28 қаңтардағы № 34/182 шешімімен
