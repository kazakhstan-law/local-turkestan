  title:
    rus: О внесении изменений в решение Байдибекского районного маслихата от 9 апреля 2016 года № 47/259 «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Байдибекского района»
    kaz: Бәйдібек аудандық мәслихатының 2016 жылғы 9 ақпандағы №47/259 «Бәйдібек ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы» шешіміне өзгеріс енгізу туралы
