act_code: '37854'
requisite: Оңтүстік Қазақстан облысы Бәйдібек аудандық мәслихатының 2007 жылғы 25 желтоқсандағы N 4/20 шешімі. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2008 жылғы 1 ақпанда N 14-5-55 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек аудандық мәслихатының 2009 жылғы 30 маусымдағы N 20/118 Шешімімен
