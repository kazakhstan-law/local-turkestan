act_code: '59465'
requisite: Оңтүстік Қазақстан облысы Бәйдібек аудандық мәслихат сессиясының 2011 жылғы 30 мамырдағы N 44/250 шешімі. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2011 жылғы 28 маусымда N 14-5-112 тіркелді
title:
  rus: Бәйдібек ауданының ауылдық елдi мекендерiне 2011 жылы жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
