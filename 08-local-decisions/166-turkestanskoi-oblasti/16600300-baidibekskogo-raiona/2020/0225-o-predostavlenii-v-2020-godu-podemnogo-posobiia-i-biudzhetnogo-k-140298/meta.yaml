act_code: '140298'
requisite: Решение Байдибекского районного маслихата Туркестанской области от 25 февраля 2020 года № 47/295. Зарегистрировано Департаментом юстиции Туркестанской области 28 февраля 2020 года № 5456
title:
  rus: О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Байдибек
  kaz: Бәйдібек ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
