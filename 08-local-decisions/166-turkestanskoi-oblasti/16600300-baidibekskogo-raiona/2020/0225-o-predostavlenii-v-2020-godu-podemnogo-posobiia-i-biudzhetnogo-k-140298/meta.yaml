  title:
    rus: О внесении изменений в решение маслихата района Байдибек от 25 февраля 2020 года № 47/295 «О предоставлении в 2020 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Байдибек»
    kaz: Бәйдібек аудандық мәслихатының 2020 жылғы 25 ақпандағы № 47/295 «Бәйдібек ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгерістер енгізу туралы
