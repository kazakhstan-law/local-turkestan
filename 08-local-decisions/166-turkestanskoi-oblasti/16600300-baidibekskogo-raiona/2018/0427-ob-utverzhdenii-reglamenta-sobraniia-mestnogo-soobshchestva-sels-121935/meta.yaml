  requisite: Решение Байдибекского районного маслихата Туркестанской области от 29 октября 2021 года № 10/64
  title:
    rus: О внесении изменений в решение маслихата района Байдибек от 30 мая 2014 года № 25/139 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в  Байдибекском районе»
    kaz: Бәйдідбек аудандық мәслихатының 2014 жылғы 30 мамырдағы № 25/139 «Бәйдібек ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/167993/rus
