act_code: '64501'
requisite: Решение маслихата Байдибекского района Южно-Казахстанской области от 12 марта 2012 года N 2/10. Зарегистрировано Управлением юстиции Байдибекского района Южно-Казахстанской области 10 апреля 2012 года N 14-5-130. Утратило силу в связи с истечением срока применения - (письмо Байдибекского районного маслихата Южно-Казахстанской области от 4 февраля 2013 года № 7)
title:
  rus: О предоставлении в 2012 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Байдибекского района
  kaz: Бәйдібек ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы көтерме жәрдемақы және тұрғын үй сатып алу үшiн әлеуметтiк қолдауды ұсыну туралы
