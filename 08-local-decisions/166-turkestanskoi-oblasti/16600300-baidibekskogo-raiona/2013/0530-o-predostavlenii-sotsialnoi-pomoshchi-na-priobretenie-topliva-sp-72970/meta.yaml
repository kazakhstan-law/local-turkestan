requisite: Решение Байдибекского районного маслихата Южно-Казахстанской области от 30 мая 2013 года № 12/68. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 11 июня 2013 года № 2308
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Байдибекского района
  kaz: Бәйдібек ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
