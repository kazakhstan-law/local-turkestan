act_code: '80738'
requisite: Решение Байдибекского районного маслихата Южно-Казахстанской области от 30 мая 2014 года № 25/139. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 июня 2014 года № 2700. Утратило силу решением Байдибекского районного маслихата Туркестанской области от 11 октября 2023 года № 7/34 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Байдибекском районе
  kaz: Бәйдібек ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
